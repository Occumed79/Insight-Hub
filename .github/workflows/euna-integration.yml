name: Euna integration validation

on:
  push:
    branches:
      - agent/add-euna-supplier-network

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/add-euna-supplier-network

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Patch provider wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "api-server/src/lib/config/providerConfig.ts",
              '  | "publicPortalProviders"\n  | "gemini"',
              '  | "publicPortalProviders"\n  | "eunaBonfire"\n  | "gemini"',
          )
          replace_once(
              "api-server/src/lib/config/providerConfig.ts",
              '  gemini: provider(',
              '  eunaBonfire: provider("eunaBonfire", "Euna Supplier Network", "procurement", "web_discovery", [], ["Standalone Euna/Bonfire opportunity discovery", "Public agency portal results", "Occu-Med relevance filtering", "Cross-provider deduplication"], "live", "Separate Euna Supplier Network / Bonfire provider that discovers public opportunity pages through the configured Serper key. No Euna credentials are stored."),\n  gemini: provider(',
          )

          replace_once(
              "api-server/src/lib/providers/index.ts",
              'export * from "./publicPortalProviders";\nexport * from "./gemini";',
              'export * from "./publicPortalProviders";\nexport * from "./eunaBonfire";\nexport * from "./gemini";',
          )
          replace_once(
              "api-server/src/lib/providers/index.ts",
              'import { publicPortalProvidersProvider } from "./publicPortalProviders";\nimport { geminiProvider } from "./gemini";',
              'import { publicPortalProvidersProvider } from "./publicPortalProviders";\nimport { eunaBonfireProvider } from "./eunaBonfire";\nimport { geminiProvider } from "./gemini";',
          )
          replace_once(
              "api-server/src/lib/providers/index.ts",
              '  publicPortalProviders: publicPortalProvidersProvider,\n  usaSpending: usaSpendingProvider,',
              '  publicPortalProviders: publicPortalProvidersProvider,\n  eunaBonfire: eunaBonfireProvider,\n  usaSpending: usaSpendingProvider,',
          )

          replace_once(
              "api-server/src/lib/search/unifiedSearch.ts",
              'import { publicPortalProvidersProvider } from "../providers/publicPortalProviders";\nimport { tangoProvider } from "../providers/tango";',
              'import { publicPortalProvidersProvider } from "../providers/publicPortalProviders";\nimport { eunaBonfireProvider } from "../providers/eunaBonfire";\nimport { tangoProvider } from "../providers/tango";',
          )
          replace_once(
              "api-server/src/lib/search/unifiedSearch.ts",
              '  await runProvider("publicPortalProviders", publicPortalProvidersProvider);\n  await runProvider("grantsGov", grantsGovProvider);',
              '  await runProvider("publicPortalProviders", publicPortalProvidersProvider);\n  await runProvider("eunaBonfire", eunaBonfireProvider);\n  await runProvider("grantsGov", grantsGovProvider);',
          )

          replace_once(
              "api-server/src/lib/search/scheduler.ts",
              '["samGov", "grantsGov", "publicPortalProviders", "serper", "tavily"]',
              '["samGov", "grantsGov", "publicPortalProviders", "eunaBonfire", "serper", "tavily"]',
          )
          replace_once(
              "render.yaml",
              'value: samGov,grantsGov,publicPortalProviders,serper,tavily',
              'value: samGov,grantsGov,publicPortalProviders,eunaBonfire,serper,tavily',
          )

          replace_once(
              "api-server/src/routes/opportunities.ts",
              '      public_portals: "publicPortalProviders",\n      usaSpending: "usaSpending",',
              '      public_portals: "publicPortalProviders",\n      eunaBonfire: "eunaBonfire",\n      euna_bonfire: "eunaBonfire",\n      eunaSupplierNetwork: "eunaBonfire",\n      usaSpending: "usaSpending",',
          )

          replace_once(
              "intel-suite/src/pages/portal/opportunities.tsx",
              '  { key: "publicPortalProviders", label: "Public Portal Providers", desc: "Direct parsers + Serper official-portal discovery", stub: false },\n  { key: "olostep",',
              '  { key: "publicPortalProviders", label: "Public Portal Providers", desc: "Direct parsers + Serper official-portal discovery", stub: false },\n  { key: "eunaBonfire", label: "Euna Supplier Network", desc: "Separate public Bonfire/Euna opportunity discovery", stub: false },\n  { key: "olostep",',
          )
          replace_once(
              "intel-suite/src/pages/portal/opportunities.tsx",
              '["sam_gov", "grantsGov", "usaSpending", "serper", "tavily", "publicPortalProviders"]',
              '["sam_gov", "grantsGov", "usaSpending", "serper", "tavily", "publicPortalProviders", "eunaBonfire"]',
          )
          PY

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Production build
        run: pnpm run build:prod

      - name: Verify Euna separation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          checks = {
              "api-server/src/lib/providers/eunaBonfire.ts": [
                  'readonly name = "eunaBonfire"',
                  'source: "eunaBonfire"',
                  'serper_public_euna',
                  'no supplier credentials were used',
              ],
              "api-server/src/lib/search/unifiedSearch.ts": [
                  'runProvider("eunaBonfire", eunaBonfireProvider)',
              ],
              "intel-suite/src/pages/portal/opportunities.tsx": [
                  'key: "eunaBonfire"',
                  'Separate public Bonfire/Euna opportunity discovery',
              ],
          }
          for path, needles in checks.items():
              text = Path(path).read_text()
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f"Missing {needle!r} in {path}")

          public_portal = Path("api-server/src/lib/providers/publicPortalProviders/index.ts").read_text()
          if "eunaBonfire" in public_portal:
              raise SystemExit("Euna was incorrectly folded into Public Portal Providers")
          PY

      - name: Commit validated integration
        shell: bash
        run: |
          rm .github/workflows/euna-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire standalone Euna Supplier Network provider"
          git push origin HEAD:agent/add-euna-supplier-network
