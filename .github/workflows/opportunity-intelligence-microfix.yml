name: Opportunity Intelligence microfix

on:
  push:
    branches:
      - hardening/opportunity-intelligence-function
    paths:
      - .github/workflows/opportunity-intelligence-microfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/opportunity-intelligence-function
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def one(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: exact match count={text.count(old)} for {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          one(
            "api-server/src/routes/opportunities.ts",
            '''        stats.agencyUpdated++;\n        updatedIds.add(rec.id);''',
            '''        stats.agencyUpdated++;\n        updatedIds.add(rec.id);\n        rec.agency = agencyHint;''',
          )

          ui = "intel-suite/src/pages/portal/opportunities.tsx"
          one(ui, "Provider errors", "Provider warnings / errors")
          one(ui, "Retry Failed Providers", "Retry Problem Sources")
          one(
            ui,
            '''        {oppsData && oppsData.total > 0 && (\n          <div className="mt-4 pt-4 border-t border-white/10 flex flex-col sm:flex-row justify-between gap-3 sm:items-center text-sm text-muted-foreground">''',
            '''        {Boolean((oppsData as any)?.ranking?.truncated) && (\n          <div className="mt-4 rounded-xl border border-amber-500/20 bg-amber-500/[0.06] px-4 py-3 text-xs text-amber-100">\n            Ranking reached its bounded candidate window. Refine the search or filters for an exact total.\n          </div>\n        )}\n\n        {oppsData && oppsData.total > 0 && (\n          <div className="mt-4 pt-4 border-t border-white/10 flex flex-col sm:flex-row justify-between gap-3 sm:items-center text-sm text-muted-foreground">''',
          )

          Path(".github/workflows/opportunity-intelligence-microfix.yml").unlink()
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish Opportunity Intelligence status truthfulness"
          git push origin HEAD:hardening/opportunity-intelligence-function
