name: Inspect portal directory wiring

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  inspect:
    if: github.head_ref == 'agent/expand-portal-directory-international'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/expand-portal-directory-international
          fetch-depth: 0
      - name: Capture portal duplicate check
        shell: bash
        run: |
          if [ -f tmp/portal-duplicate-check.txt ]; then
            echo 'Duplicate-check file already exists.'
            exit 0
          fi
          mkdir -p tmp
          {
            echo '=== REQUESTED AND CANDIDATE PORTALS ALREADY IN CATALOG ==='
            grep -RInEi --include='directRfpPortals*.ts' 'COMMBUYS|RAMP|PASSPort|Washington.*WEBS|\bWEBS\b|eMarketplace|NevadaEPro|CanadaBuys|SEAO|SaskTenders|CivicInfo|City of Toronto|Contracts Finder|Find a Tender|Public Contracts Scotland|Sell2Wales|eTendersNI|TED|TenderNed|eTenders Ireland|marches-publics|e-Vergabe|contrataciondelestado|BASE Portugal|publicprocurement.be|simap' api-server/src/lib/providers || true
            echo '=== INTERNATIONAL PORTAL ENTRIES ==='
            grep -RIn --include='directRfpPortals*.ts' 'level: "international"' api-server/src/lib/providers || true
          } > tmp/portal-duplicate-check.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/portal-duplicate-check.txt
          git commit -m 'Capture portal duplicate check'
          git push origin HEAD:agent/expand-portal-directory-international
