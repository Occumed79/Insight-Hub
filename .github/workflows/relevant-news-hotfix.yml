name: Relevant News federal filter hotfix

on:
  push:
    branches:
      - hotfix/relevant-news-federal-filter
    paths:
      - .github/workflows/relevant-news-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Fix Relevant News federal-context filter') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/relevant-news-federal-filter
          fetch-depth: 0
      - name: Patch scorer and add regression coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('api-server/src/routes/relevant-news.ts')
          text = path.read_text()

          old = '''function relevanceScore(article: JsonRecord): number {\n  const source = asRecord(article.source);\n  const haystack = [article.title, article.description, article.content, source.name]\n    .map((value) => asString(value) ?? "")\n    .join(" ")\n    .toLowerCase();\n\n  const weightedTerms: Array<[string, number]> = ['''
          new = '''const FEDERAL_CONTEXT_TERMS = [\n  "federal",\n  "department of defense",\n  "defense department",\n  "pentagon",\n  "u.s. army",\n  "us army",\n  "army",\n  "u.s. navy",\n  "us navy",\n  "navy",\n  "air force",\n  "space force",\n  "marine corps",\n  "homeland security",\n  "customs and border protection",\n  "border patrol",\n  "department of veterans affairs",\n  "veterans affairs",\n  "general services administration",\n  "department of health and human services",\n  "department of energy",\n  "department of labor",\n  "dod",\n  "dhs",\n  "gsa",\n  "hhs",\n  "cbp",\n  "fema",\n  "tsa",\n  "nih",\n  "cdc",\n];\n\nconst PROCUREMENT_CONTEXT_TERMS = [\n  "contract",\n  "award",\n  "procurement",\n  "acquisition",\n  "solicitation",\n  "recompete",\n  "request for proposal",\n  "rfp",\n  "bid",\n];\n\nfunction containsAny(haystack: string, terms: readonly string[]): boolean {\n  return terms.some((term) => haystack.includes(term));\n}\n\nexport function relevantNewsScore(article: JsonRecord): number {\n  const source = asRecord(article.source);\n  const haystack = [article.title, article.description, article.content, source.name]\n    .map((value) => asString(value) ?? "")\n    .join(" ")\n    .toLowerCase();\n\n  // Generic corporate stories about a "contract award" are not federal\n  // contractor intelligence. Require both U.S. federal context and a real\n  // procurement/contract signal before weighted scoring can admit an article.\n  if (\n    !containsAny(haystack, FEDERAL_CONTEXT_TERMS) ||\n    !containsAny(haystack, PROCUREMENT_CONTEXT_TERMS)\n  ) {\n    return 0;\n  }\n\n  const weightedTerms: Array<[string, number]> = ['''
          if text.count(old) != 1:
              raise SystemExit('scorer anchor did not match exactly once')
          text = text.replace(old, new, 1)
          text = text.replace('''    ["contractor", 2],\n  ];\n\n  return weightedTerms.reduce((score, [term, weight]) => score + (haystack.includes(term) ? weight : 0), 0);\n}''', '''    ["contractor", 2],\n    ["contract", 3],\n    ["army", 4],\n    ["navy", 4],\n    ["air force", 4],\n    ["space force", 4],\n    ["marine corps", 4],\n    ["pentagon", 4],\n  ];\n\n  return weightedTerms.reduce((score, [term, weight]) => score + (haystack.includes(term) ? weight : 0), 0);\n}''', 1)
          text = text.replace('relevanceScore: relevanceScore(raw),', 'relevanceScore: relevantNewsScore(raw),', 1)
          text = text.replace('.filter((article) => article.relevanceScore >= 2)', '.filter((article) => article.relevanceScore >= 6)', 1)
          path.write_text(text)

          test = Path('api-server/src/routes/__tests__/relevantNews.test.ts')
          test.parent.mkdir(parents=True, exist_ok=True)
          test.write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport { relevantNewsScore } from "../relevant-news";\n\ntest("rejects generic corporate contract-award coverage without federal context", () => {\n  const score = relevantNewsScore({\n    title: "Honda awards vehicle development contract to Tata Technologies",\n    description: "A Japanese automaker awarded a private vehicle program.",\n    source: { name: "Business News", country: "in" },\n  });\n  assert.equal(score, 0);\n});\n\ntest("accepts U.S. military contract reporting", () => {\n  const score = relevantNewsScore({\n    title: "Army nears laser weapon contract award",\n    description: "The U.S. Army is preparing a defense procurement award.",\n    source: { name: "Defense News", country: "us" },\n  });\n  assert.ok(score >= 6);\n});\n\ntest("accepts federal occupational-health procurement reporting", () => {\n  const score = relevantNewsScore({\n    title: "DHS issues solicitation for employee medical services",\n    description: "Department of Homeland Security procurement for occupational health examinations.",\n    source: { name: "Federal News", country: "us" },\n  });\n  assert.ok(score >= 6);\n});\n''')

          Path('.github/workflows/relevant-news-hotfix.yml').unlink()
          PY
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Relevant News federal-context filter"
          git push origin HEAD:hotfix/relevant-news-federal-filter
