name: Capture typecheck errors

on:
  push:
    branches:
      - agent/provider-boundary-cleanup

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/provider-boundary-cleanup
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@10.10.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture typecheck output
        shell: bash
        run: |
          set +e
          pnpm run typecheck > typecheck-errors.txt 2>&1
          status=$?
          echo "TYPECHECK_EXIT_STATUS=$status" >> typecheck-errors.txt
          exit 0

      - name: Commit diagnostic output and remove workflow
        shell: bash
        run: |
          rm .github/workflows/capture-typecheck-errors.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add typecheck-errors.txt .github/workflows/capture-typecheck-errors.yml
          git commit -m "Capture provider cleanup typecheck output"
          git push origin HEAD:agent/provider-boundary-cleanup
