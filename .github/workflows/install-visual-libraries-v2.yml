name: Install Visualization Libraries V2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/install-visual-libraries-v2.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - name: Install visualization libraries
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/Occumed79/Network-Map/main/.github/scripts/install-visual-arsenal-v2.sh -o /tmp/install-visual-libraries-v2.sh
          bash /tmp/install-visual-libraries-v2.sh
