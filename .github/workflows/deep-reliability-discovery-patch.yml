name: Deep reliability discovery patch

on:
  push:
    branches:
      - hardening/deep-reliability-beast-pass
    paths:
      - .github/workflows/deep-reliability-discovery-patch.yml

permissions:
  contents: write

jobs:
  patch-discovery-http:
    if: ${{ !contains(github.event.head_commit.message, 'Bind discovery HTTP to attempt deadlines') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/deep-reliability-beast-pass
          fetch-depth: 0

      - name: Patch existing discovery transports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          web_path = Path("api-server/src/lib/search/webIntelligence.ts")
          web = web_path.read_text()
          web = web.replace(
              '''      run: () => Promise<Candidate[]>;''',
              '''      run: (signal?: AbortSignal) => Promise<Candidate[]>;''',
              1,
          )

          start = web.index("  for (const query of discoveryQueries) {")
          stop = web.index("    const result = await runLimitedProviderPool(", start)
          discovery = web[start:stop]
          discovery = discovery.replace("run: async () =>", "run: async (attemptSignal) =>")
          discovery = discovery.replace("options.signal", "attemptSignal ?? options.signal")
          web = web[:start] + discovery + web[stop:]

          enrich_start = web.index("  for (const { candidate, index } of toEnrich) {")
          enrich_stop = web.index("    const enriched = await runLimitedProviderPool(", enrich_start)
          enrich = web[enrich_start:enrich_stop]
          enrich = enrich.replace("run: async () =>", "run: async (attemptSignal) =>")
          enrich = enrich.replace("run: () =>", "run: (attemptSignal) =>")
          enrich = enrich.replace(
              "selfHostedCrawlerProvider.getText(candidate.url)",
              "selfHostedCrawlerProvider.getText(candidate.url, { signal: attemptSignal ?? options.signal })",
          )
          enrich = enrich.replace(
              "firecrawlProvider.scrape(candidate.url)",
              "firecrawlProvider.scrape(candidate.url, attemptSignal ?? options.signal)",
          )
          enrich = enrich.replace(
              "jinaProvider.extractUrl(candidate.url, 5_000)",
              "jinaProvider.extractUrl(candidate.url, 5_000, attemptSignal ?? options.signal)",
          )
          enrich = enrich.replace(
              "olostepProvider.getText(candidate.url)",
              "olostepProvider.getText(candidate.url, attemptSignal ?? options.signal)",
          )
          enrich = enrich.replace(
              "cloudflareWorkerProvider.extractUrl(candidate.url)",
              "cloudflareWorkerProvider.extractUrl(candidate.url, 8_000, attemptSignal ?? options.signal)",
          )
          web = web[:enrich_start] + enrich + web[enrich_stop:]
          web_path.write_text(web)

          firecrawl = "api-server/src/lib/providers/firecrawl.ts"
          replace_once(
              firecrawl,
              '''  async scrape(url: string): Promise<FirecrawlScrapeResult | null> {''',
              '''  async scrape(\n    url: string,\n    signal?: AbortSignal,\n  ): Promise<FirecrawlScrapeResult | null> {''',
          )
          replace_once(
              firecrawl,
              '''        timeout: 20000,\n      }),\n    });''',
              '''        timeout: 20000,\n      }),\n      signal: signal\n        ? AbortSignal.any([signal, AbortSignal.timeout(25_000)])\n        : AbortSignal.timeout(25_000),\n    });''',
          )

          jina = "api-server/src/lib/providers/jina.ts"
          replace_once(
              jina,
              '''  async extractUrl(url: string, maxLength = 8000): Promise<string | null> {''',
              '''  async extractUrl(\n    url: string,\n    maxLength = 8000,\n    signal?: AbortSignal,\n  ): Promise<string | null> {''',
          )
          replace_once(
              jina,
              '''        signal: AbortSignal.timeout(15000),''',
              '''        signal: signal\n          ? AbortSignal.any([signal, AbortSignal.timeout(15_000)])\n          : AbortSignal.timeout(15_000),''',
          )

          worker = "api-server/src/lib/providers/cloudflareWorker.ts"
          replace_once(
              worker,
              '''  async extractUrl(url: string, maxLength = 8000): Promise<string | null> {''',
              '''  async extractUrl(\n    url: string,\n    maxLength = 8000,\n    signal?: AbortSignal,\n  ): Promise<string | null> {''',
          )
          replace_once(
              worker,
              '''        signal: AbortSignal.timeout(20000),''',
              '''        signal: signal\n          ? AbortSignal.any([signal, AbortSignal.timeout(20_000)])\n          : AbortSignal.timeout(20_000),''',
          )

          Path(".github/workflows/deep-reliability-discovery-patch.yml").unlink()
          PY

      - name: Commit discovery cancellation fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Bind discovery HTTP to attempt deadlines"
          git push origin HEAD:hardening/deep-reliability-beast-pass
