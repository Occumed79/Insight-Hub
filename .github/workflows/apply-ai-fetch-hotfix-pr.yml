name: Apply AI Fetch restoration on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  restore:
    if: github.head_ref == 'agent/restore-ai-fetch-now'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-ai-fetch-now
          fetch-depth: 0
      - name: Apply restoration
        run: python3 scripts/restore-ai-fetch.py
      - name: Validate
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm --filter @workspace/api-server exec node --import tsx --test src/lib/ingestion/__tests__/providerRunner.test.ts
          pnpm run build:prod
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore AI-led Fetch Intelligence and disable portal scraping"
          git push origin HEAD:agent/restore-ai-fetch-now
