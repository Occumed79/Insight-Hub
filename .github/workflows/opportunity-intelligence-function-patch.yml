name: Opportunity Intelligence functional hardening patch

on:
  push:
    branches:
      - hardening/opportunity-intelligence-function
    paths:
      - .github/workflows/opportunity-intelligence-function-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/opportunity-intelligence-function
          fetch-depth: 0
      - name: Apply focused functional hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          def regex_once(path, pattern, replacement):
              p = Path(path)
              text = p.read_text()
              new, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: expected one regex match, found {count}: {pattern[:80]!r}")
              p.write_text(new)

          manual = "api-server/src/lib/ingestion/manualIngestion.ts"
          replace_once(manual,
          '''import {
            classifyIdentityMatch,
            failedProvidersForRetry,
            protectedLineageKeys,
            shouldProtectCanonicalFromRefresh,
            STALE_INGESTION_RUN_AFTER_MS,
          } from "./pipelineRules";''',
          '''import {
            classifyIdentityMatch,
            failedProvidersForRetry,
            finalIngestionStatus,
            mergeSourceRefresh,
            opportunityIdentityLockKeys,
            protectedLineageKeys,
            shouldProtectCanonicalFromRefresh,
            STALE_INGESTION_RUN_AFTER_MS,
          } from "./pipelineRules";''')

          replace_once(manual,
          '''    const lockKey = keys[0]?.value ?? `${provider}:${providerNativeId}`;
              await tx.execute(
                sql`SELECT pg_advisory_xact_lock(hashtextextended(${lockKey}, 0))`,
              );''',
          '''    const lockKeys = opportunityIdentityLockKeys(
                keys,
                `${provider}:${providerNativeId}`,
              );
              for (const lockKey of lockKeys) {
                await tx.execute(
                  sql`SELECT pg_advisory_xact_lock(hashtextextended(${lockKey}, 0))`,
                );
              }''')

          regex_once(manual,
          r'''    if \(existing\) \{\n      const \{\n        userGrade: _userGrade,\n        userConfidence: _userConfidence,\n        notes: _notes,\n        \.\.\.sourceFields\n      \} = normalized as typeof normalized & \{\n        userGrade\?: unknown;\n        userConfidence\?: unknown;\n        notes\?: unknown;\n      \};\n      await tx\n        \.update\(opportunitiesTable\)\n        \.set\(\{\n          \.\.\.sourceFields,\n          noticeId: providerNativeId,\n          providerKey: providerKeyForOpportunity\(record\),\n          samUrl:\n            canonicalizeOpportunityUrl\(record\.sourceUrl\) \?\? sourceFields\.samUrl,\n          lastSeenAt: now,\n          updatedAt: now,\n        \}\)\n        \.where\(eq\(opportunitiesTable\.id, opportunityId\)\);\n      updated = 1;\n    \} else \{''',
          '''    if (existing && existingCanonical) {
              const merged = mergeSourceRefresh(
                existingCanonical as unknown as Record<string, unknown>,
                {
                  ...normalized,
                  noticeId: providerNativeId,
                  providerKey: providerKeyForOpportunity(record),
                  samUrl:
                    canonicalizeOpportunityUrl(record.sourceUrl) ?? normalized.samUrl,
                  lastSeenAt: now,
                  updatedAt: now,
                } as unknown as Record<string, unknown>,
              ) as typeof existingCanonical;
              const {
                id: _id,
                createdAt: _createdAt,
                firstSeenAt: _firstSeenAt,
                ...refreshFields
              } = merged;
              await tx
                .update(opportunitiesTable)
                .set(refreshFields)
                .where(eq(opportunitiesTable.id, opportunityId));
              updated = 1;
            } else {''')

          replace_once(manual,
          '''    const timedOutSources =
                latest?.sources.filter((source) => source.status === "timed_out").length ??
                timeoutCount;
              const finalStatus = cancelled
                ? "cancelled"
                : timedOut
                  ? "completed_with_errors"
                  : failedSources + timedOutSources === run.sources.length
                    ? "failed"
                    : failedSources + timedOutSources > 0
                      ? "completed_with_errors"
                      : "completed";''',
          '''    const timedOutSources =
                latest?.sources.filter((source) => source.status === "timed_out").length ??
                timeoutCount;
              const warningSources =
                latest?.sources.filter(
                  (source) => source.status === "completed" && Boolean(source.error),
                ).length ?? 0;
              const finalStatus = finalIngestionStatus({
                cancelled,
                timedOut,
                totalSources: run.sources.length,
                failedSources,
                timedOutSources,
                warningSources,
              });''')

          runner = "api-server/src/lib/ingestion/providerRunner.ts"
          replace_once(runner,
          '''import { filterExpiredOpportunities } from "./opportunityExpiration";''',
          '''import { filterExpiredOpportunities } from "./opportunityExpiration";
          import {
            calculateCompletenessScore,
            calculateOpportunityDedupeKeys,
            calculateSourceConfidence,
          } from "./opportunityIdentity";''')

          regex_once(runner,
          r'''function canonicalOpportunityKey\(record: NormalizedOpportunity\): string \{.*?\n\}\n\nfunction recordRelevance\(record: NormalizedOpportunity\): number \{.*?\n\}\n\nfunction mergeDiscoveryRecords\(\n  records: NormalizedOpportunity\[],\n\): NormalizedOpportunity\[] \{.*?\n\}''',
          '''function discoveryIdentityKey(record: NormalizedOpportunity): string {
            const keys = calculateOpportunityDedupeKeys(record);
            for (const type of ["solicitation", "url", "fingerprint"] as const) {
              const match = keys.find((key) => key.type === type);
              if (match) return match.value;
            }
            return keys.find((key) => key.type === "provider")?.value ?? `id:${record.externalId}`;
          }

          function discoveryRecordRank(record: NormalizedOpportunity): number {
            const relevance = Number(record.rawData?.relevanceScore);
            const relevanceScore = Number.isFinite(relevance) ? relevance : 0;
            const confidence = calculateSourceConfidence(record);
            const completeness = calculateCompletenessScore(record);
            const futureDeadline = Boolean(
              record.responseDeadline &&
                !Number.isNaN(record.responseDeadline.getTime()) &&
                record.responseDeadline.getTime() > Date.now(),
            );
            return (
              relevanceScore * 10_000 +
              confidence * 100 +
              completeness * 10 +
              (futureDeadline ? 250 : 0) +
              Math.min(200, record.description?.trim().length ?? 0)
            );
          }

          export function mergeDiscoveryRecords(
            records: NormalizedOpportunity[],
          ): NormalizedOpportunity[] {
            const best = new Map<string, { record: NormalizedOpportunity; rank: number }>();
            for (const record of records) {
              const key = discoveryIdentityKey(record);
              const rank = discoveryRecordRank(record);
              const existing = best.get(key);
              if (!existing || rank > existing.rank) best.set(key, { record, rank });
            }
            return [...best.values()].map((entry) => entry.record);
          }''')

          replace_once(runner,
          '''          keywords: options.keywords,
                    signal: options.signal,
                    ...discoveryOptions(provider),''',
          '''          keywords: options.keywords,
                    dateRange: options.dateRange,
                    signal: options.signal,
                    ...discoveryOptions(provider),''')

          replace_once(runner,
          '''  return {
              records: merged,
              errors: merged.length > 0 ? [] : errors,
            };''',
          '''  return {
              records: merged,
              errors: Array.from(new Set(errors)).slice(0, 20),
            };''')

          replace_once(runner,
          '''    const result = await webIntelligenceFetch({
              keywords: options.keywords,
              useSerper: provider === "serper",''',
          '''    const result = await webIntelligenceFetch({
              keywords: options.keywords,
              dateRange: options.dateRange,
              useSerper: provider === "serper",''')

          web = "api-server/src/lib/search/webIntelligence.ts"
          replace_once(web,
          '''const CURRENT_YEAR = new Date().getFullYear();
          const NEXT_YEAR = CURRENT_YEAR + 1;''',
          '''const QUERY_TEMPLATE_YEAR = new Date().getFullYear();
          const QUERY_TEMPLATE_NEXT_YEAR = QUERY_TEMPLATE_YEAR + 1;''')
          # Update template references but keep the templates themselves stable.
          p = Path(web)
          text = p.read_text().replace("${CURRENT_YEAR}", "${QUERY_TEMPLATE_YEAR}").replace("${NEXT_YEAR}", "${QUERY_TEMPLATE_NEXT_YEAR}")
          p.write_text(text)

          replace_once(web,
          '''    totalCandidates: number;
              preFiltered: number;''',
          '''    totalCandidates: number;
              dateFiltered: number;
              preFiltered: number;''')
          replace_once(web,
          '''  keywords?: string;
            useSerper?: boolean;''',
          '''  keywords?: string;
            dateRange?: number;
            useSerper?: boolean;''')
          replace_once(web,
          '''    totalCandidates: 0,
              preFiltered: 0,''',
          '''    totalCandidates: 0,
              dateFiltered: 0,
              preFiltered: 0,''')

          replace_once(web,
          '''  const useSerper = options.useSerper === true;''',
          '''  const requestedDateRange = Number(options.dateRange);
            const dateRangeDays = Number.isFinite(requestedDateRange)
              ? Math.min(3_650, Math.max(1, Math.floor(requestedDateRange)))
              : 30;
            const publishedAfter = new Date(Date.now() - dateRangeDays * 86_400_000);
            const publishedAfterIso = publishedAfter.toISOString();
            const runtimeYear = new Date().getFullYear();
            const serperRecency =
              dateRangeDays <= 7
                ? "qdr:w"
                : dateRangeDays <= 31
                  ? "qdr:m"
                  : dateRangeDays <= 365
                    ? "qdr:y"
                    : undefined;

            const useSerper = options.useSerper === true;''')

          replace_once(web,
          '''  let serperQueries: SerperQuery[] = [...OCCUMED_WEB_QUERIES];
            let exaQueries = [...EXA_QUERIES];''',
          '''  let serperQueries: SerperQuery[] = OCCUMED_WEB_QUERIES.map((entry) => ({
              ...entry,
              query: entry.query.replaceAll(String(QUERY_TEMPLATE_YEAR), String(runtimeYear)),
            }));
            let exaQueries = EXA_QUERIES.map((query) =>
              query.replaceAll(String(QUERY_TEMPLATE_YEAR), String(runtimeYear)),
            );''')
          p = Path(web)
          text = p.read_text()
          # Only custom runtime query construction should use runtimeYear now.
          text = text.replace('government ${QUERY_TEMPLATE_YEAR} -awarded -"contract award"`;', 'government ${runtimeYear} -awarded -"contract award"`;')
          text = text.replace('services ${QUERY_TEMPLATE_YEAR}`,\n      ...exaQueries,', 'services ${runtimeYear}`,\n      ...exaQueries,')
          p.write_text(text)

          replace_once(web,
          '''  const discoveryQueries = Array.from(
              new Set([...serperQueries.map((entry) => entry.query), ...exaQueries]),
            ).slice(0, 10);

            for (const query of discoveryQueries) {''',
          '''  const discoveryQueries = Array.from(
              new Set([...serperQueries.map((entry) => entry.query), ...exaQueries]),
            ).slice(0, 10);
            const serperQueryMetadata = new Map(
              serperQueries.map((entry) => [entry.query, entry] as const),
            );

            for (const query of discoveryQueries) {
              const serperQuery = serperQueryMetadata.get(query);''')

          replace_once(web,
          '''            await serperProvider.search(query, SERPER_RESULTS_PER_QUERY, {
                          signal: attemptSignal ?? options.signal,
                        })''',
          '''            await serperProvider.search(query, SERPER_RESULTS_PER_QUERY, {
                          type: serperQuery?.type,
                          tbs: serperRecency ?? serperQuery?.tbs,
                          signal: attemptSignal ?? options.signal,
                        })''')

          replace_once(web,
          '''              numResults: EXA_RESULTS_PER_QUERY,
                          signal: attemptSignal ?? options.signal,''',
          '''              numResults: EXA_RESULTS_PER_QUERY,
                          startPublishedDate: publishedAfterIso,
                          signal: attemptSignal ?? options.signal,''')

          replace_once(web,
          '''              dateRange: options.keywords ? 365 : 30,
                          signal: attemptSignal ?? options.signal,''',
          '''              dateRange: dateRangeDays,
                          signal: attemptSignal ?? options.signal,''')

          replace_once(web,
          '''  stats.totalCandidates = candidates.length;
            const filtered = candidates.filter(isRfpCandidate);
            stats.preFiltered = filtered.length;
            stats.rejected = candidates.length - filtered.length;''',
          '''  stats.totalCandidates = candidates.length;
            const dateBoundedCandidates = candidates.filter((candidate) => {
              if (!candidate.dateRaw) return true;
              const parsed = new Date(candidate.dateRaw);
              return Number.isNaN(parsed.getTime()) || parsed.getTime() >= publishedAfter.getTime();
            });
            stats.dateFiltered = candidates.length - dateBoundedCandidates.length;
            const filtered = dateBoundedCandidates.filter(isRfpCandidate);
            stats.preFiltered = filtered.length;
            stats.rejected = candidates.length - filtered.length;''')

          quality = "api-server/src/lib/opportunityQuality.ts"
          replace_once(quality,
          '''  "langsearch",
            "websearch",
          ]);''',
          '''  "langsearch",
            "parallel",
            "linkup",
            "socrata",
            "websearch",
            "aiDiscovery",
            "rssAggregator",
          ]);''')

          opportunities = "api-server/src/routes/opportunities.ts"
          replace_once(opportunities, "  const MAX_RECORDS = 100;", "  const MAX_RECORDS = 30;")
          replace_once(opportunities,
          '''  const stats = { enriched: 0, agencyUpdated: 0, deadlineUpdated: 0, valueUpdated: 0, errors: [] as string[] };''',
          '''  const stats = { agencyUpdated: 0, deadlineUpdated: 0, valueUpdated: 0, errors: [] as string[] };
            const updatedIds = new Set<string>();''')
          replace_once(opportunities,
          '''      )
              .limit(MAX_RECORDS);''',
          '''      )
              .orderBy(asc(opportunitiesTable.updatedAt), asc(opportunitiesTable.id))
              .limit(MAX_RECORDS);''')
          replace_once(opportunities,
          '''        stats.agencyUpdated++;
              }
            }''',
          '''        stats.agencyUpdated++;
                updatedIds.add(rec.id);
              }
            }''')
          replace_once(opportunities,
          '''            stats.enriched++;
                  }''',
          '''            updatedIds.add(rec.id);
                  }''')
          replace_once(opportunities,
          '''      enriched: stats.enriched,''',
          '''      enriched: updatedIds.size,''')

          runview = "intel-suite/src/pages/portal/opportunityRunView.ts"
          replace_once(runview, '["Accepted", run.accepted],', '["Promoted", run.accepted],')

          ui = "intel-suite/src/pages/portal/opportunities.tsx"
          replace_once(ui,
          '''                  {!isOpportunityRunActive(currentRun.status) &&
                        (currentRun.providerErrors?.length ?? 0) > 0 && (''',
          '''                  {!isOpportunityRunActive(currentRun.status) &&
                        (currentRun.providersFailed ?? 0) > 0 && (''')
          replace_once(ui,
          '''        {oppsData && oppsData.total > 0 && (
                  <div className="mt-4 pt-4 border-t border-white/10 flex flex-col sm:flex-row justify-between gap-3 sm:items-center text-sm text-muted-foreground">''',
          '''        {Boolean((oppsData as any)?.ranking?.truncated) && (
                  <div className="mt-4 rounded-xl border border-amber-500/20 bg-amber-500/[0.06] px-4 py-3 text-xs text-amber-100">
                    Ranking reached its bounded candidate window. Refine the query or filters for an exact total instead of treating this page as the complete corpus.
                  </div>
                )}

                {oppsData && oppsData.total > 0 && (
                  <div className="mt-4 pt-4 border-t border-white/10 flex flex-col sm:flex-row justify-between gap-3 sm:items-center text-sm text-muted-foreground">''')

          manual_test = "api-server/src/lib/ingestion/__tests__/manualIngestion.test.ts"
          replace_once(manual_test,
          '''  classifyIdentityMatch,
            failedProvidersForRetry,
            isStaleIngestionRun,
            mergeSourceRefresh,
            protectedLineageKeys,''',
          '''  classifyIdentityMatch,
            failedProvidersForRetry,
            finalIngestionStatus,
            isStaleIngestionRun,
            mergeSourceRefresh,
            opportunityIdentityLockKeys,
            protectedLineageKeys,''')
          insert_marker = '''  it("does not let a fallback solicitation match refresh canonical fields", () => {'''
          p = Path(manual_test)
          text = p.read_text()
          if text.count(insert_marker) != 1:
              raise SystemExit("manual test insertion marker missing")
          tests = '''  it("keeps SAM canonical ownership when an equal-evidence Tango copy arrives", () => {
              const existing = {
                id: "one",
                providerKey: "samGov",
                providerName: "samGov",
                source: "sam_gov",
                title: "Official SAM title",
                description: "Rich official description",
                agency: "Department of Defense",
                tags: JSON.stringify(["evidence:direct-structured", "sam"]),
                sourceConfidence: "high",
                createdAt: "created",
                firstSeenAt: "first",
                notes: "preserved notes",
                userGrade: "excellent",
                userConfidence: 95,
              };
              const incoming = {
                providerKey: "tango",
                providerName: "tango",
                source: "manual",
                title: "Tango copy",
                description: null,
                agency: "Department of Defense",
                estimatedValue: "120000",
                tags: JSON.stringify(["evidence:direct-structured", "tango"]),
                sourceConfidence: "medium",
              };
              const merged = mergeSourceRefresh(existing, incoming as any);
              assert.equal(merged.providerKey, "samGov");
              assert.equal(merged.title, "Official SAM title");
              assert.equal(merged.description, "Rich official description");
              assert.equal(merged.estimatedValue, "120000");
              assert.equal(merged.sourceConfidence, "high");
              assert.match(String(merged.tags), /sam/);
              assert.match(String(merged.tags), /tango/);
              assert.equal(merged.userGrade, "excellent");
            });

            it("lets higher-authority SAM replace Tango canonical source fields", () => {
              const existing = {
                id: "one",
                providerKey: "tango",
                providerName: "tango",
                source: "manual",
                title: "Tango title",
                createdAt: "created",
                firstSeenAt: "first",
                notes: "note",
              };
              const merged = mergeSourceRefresh(existing, {
                providerKey: "samGov",
                providerName: "samGov",
                source: "sam_gov",
                title: "Official SAM amendment",
              } as any);
              assert.equal(merged.providerKey, "samGov");
              assert.equal(merged.title, "Official SAM amendment");
            });

            it("locks every dedupe identity in deterministic order", () => {
              const keys = calculateOpportunityDedupeKeys(fixture());
              const locks = opportunityIdentityLockKeys(keys.slice().reverse(), "fallback");
              assert.deepEqual(locks, [...locks].sort());
              assert.equal(new Set(locks).size, locks.length);
              assert.ok(locks.some((key) => key.startsWith("solicitation:")));
            });

          '''
          p.write_text(text.replace(insert_marker, tests + insert_marker, 1))

          final_marker = '''  it("selects only failed providers for retry", () => {'''
          p = Path(manual_test)
          text = p.read_text()
          if text.count(final_marker) != 1:
              raise SystemExit("final status test marker missing")
          status_test = '''  it("marks recovered provider warnings as completed_with_errors", () => {
              assert.equal(
                finalIngestionStatus({
                  cancelled: false,
                  timedOut: false,
                  totalSources: 3,
                  failedSources: 0,
                  timedOutSources: 0,
                  warningSources: 1,
                }),
                "completed_with_errors",
              );
              assert.equal(
                finalIngestionStatus({
                  cancelled: false,
                  timedOut: false,
                  totalSources: 3,
                  failedSources: 0,
                  timedOutSources: 0,
                  warningSources: 0,
                }),
                "completed",
              );
            });

          '''
          p.write_text(text.replace(final_marker, status_test + final_marker, 1))

          provider_test = "api-server/src/lib/ingestion/__tests__/providerRunner.test.ts"
          replace_once(provider_test,
          '''  effectiveProviderQuery,
            resolveManualProviders,
          } = await import("../providerRunner");''',
          '''  effectiveProviderQuery,
            mergeDiscoveryRecords,
            resolveManualProviders,
          } = await import("../providerRunner");''')
          p = Path(provider_test)
          text = p.read_text()
          text += '''\n\ntest("browser discovery deduplicates one solicitation across different result URLs", () => {
            const base = {
              title: "Occupational Health Services RFP",
              agency: "County of Fresno",
              type: "RFP",
              status: "active" as const,
              postedDate: new Date("2026-08-01T00:00:00Z"),
              responseDeadline: new Date("2026-09-01T00:00:00Z"),
              solicitationNumber: "RFP-26-100",
              description: "Occupational health examinations and drug testing.",
            };
            const merged = mergeDiscoveryRecords([
              {
                ...base,
                externalId: "serper-1",
                source: "serper",
                sourceUrl: "https://search.example/one",
                rawData: { relevanceScore: 72, sourceConfidence: "low" },
              },
              {
                ...base,
                externalId: "exa-1",
                source: "exa",
                sourceUrl: "https://official.example/rfp-26-100",
                description: "Occupational health examinations, drug testing, audiometry, and medical surveillance.",
                rawData: { relevanceScore: 86, sourceConfidence: "medium" },
              },
            ] as any);
            assert.equal(merged.length, 1);
            assert.equal(merged[0].externalId, "exa-1");
          });
          '''
          p.write_text(text)

          # Add a source-level regression in the already-executed ingestion suite so
          # browser date range can never silently fall back to 365 days again.
          p = Path(manual_test)
          text = p.read_text()
          end_marker = '''  it("GET /opportunities contains no archive mutation", async () => {'''
          if text.count(end_marker) != 1:
              raise SystemExit("date-range test marker missing")
          range_test = '''  it("propagates the requested date range through browser discovery", async () => {
              const runner = await readFile(
                path.resolve(process.cwd(), "src/lib/ingestion/providerRunner.ts"),
                "utf8",
              );
              const web = await readFile(
                path.resolve(process.cwd(), "src/lib/search/webIntelligence.ts"),
                "utf8",
              );
              assert.ok(runner.includes("dateRange: options.dateRange"));
              assert.ok(web.includes("dateRangeDays"));
              assert.ok(web.includes("startPublishedDate: publishedAfterIso"));
              assert.ok(web.includes("dateRange: dateRangeDays"));
              assert.ok(web.includes("serperRecency"));
              assert.equal(web.includes("options.keywords ? 365 : 30"), false);
            });

          '''
          p.write_text(text.replace(end_marker, range_test + end_marker, 1))
          PY

          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-server/src intel-suite/src
          git commit -m "Harden Opportunity Intelligence function"
          git push origin HEAD:hardening/opportunity-intelligence-function
