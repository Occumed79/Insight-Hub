name: Bootstrap blocked-state deep recovery

on:
  push:
    branches:
      - agent/statewide-blocked-deep-recovery
    paths:
      - .github/workflows/deep-recovery-bootstrap.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: agent/statewide-blocked-deep-recovery
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply first deep-recovery batch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              file.write_text(text.replace(old, new, 1))

          # Preserve precise network diagnostics instead of generic `fetch failed`.
          path = Path("api-server/src/lib/providers/officialPortalHttp.ts")
          text = path.read_text()
          marker = "export async function fetchOfficialPortalText(\n"
          helper = r'''export function describeOfficialPortalRequestError(
            error: unknown,
            label: string,
            timeoutMs: number,
          ): string {
            if (!(error instanceof Error)) return `${label} request failed: ${String(error)}`;
            if (error.name === "AbortError") return `${label} timed out after ${timeoutMs}ms`;
            if (error.message.startsWith(`${label} `)) return error.message;

            const cause = (error as Error & { cause?: unknown }).cause;
            const details = cause && typeof cause === "object"
              ? cause as Record<string, unknown>
              : undefined;
            const diagnostics = ["code", "syscall", "hostname", "address", "port"]
              .flatMap((key) => {
                const value = details?.[key];
                return value === undefined || value === null || value === "" ? [] : [`${key}=${String(value)}`];
              });
            const suffix = diagnostics.length ? ` (${diagnostics.join(", ")})` : "";
            return `${label} network request failed${suffix}: ${error.message}`;
          }

          '''
          if text.count(marker) != 1:
              raise SystemExit("officialPortalHttp.ts: fetch marker mismatch")
          text = text.replace(marker, helper + marker, 1)
          old_final = '''  if (lastError instanceof Error) {
            if (lastError.name === "AbortError") {
              throw new Error(`${options.label} timed out after ${options.timeoutMs}ms`);
            }
            throw lastError;
          }
          throw new Error(`${options.label} request failed`);'''
          new_final = '''  throw new Error(describeOfficialPortalRequestError(lastError, options.label, options.timeoutMs));'''
          if text.count(old_final) != 1:
              raise SystemExit("officialPortalHttp.ts: final error block mismatch")
          path.write_text(text.replace(old_final, new_final, 1))

          # Parse Minnesota's official server-rendered solicitation bulletin.
          path = Path("api-server/src/lib/providers/statewideProcurementParser.ts")
          text = path.read_text()
          old_date = '''    .replace(/\\b(?:EST|EDT|CST|CDT|MST|MDT|PST|PDT|ET|CT|MT|PT)\\b/gi, "")
              .replace(/\\s+/g, " ")'''.replace("              ", "    ")
          new_date = '''    .replace(/\\b(?:EST|EDT|CST|CDT|MST|MDT|PST|PDT|ET|CT|MT|PT)\\b/gi, "")
              .replace(/\\s+at\\s+/gi, " ")
              .replace(/\\s+/g, " ")'''.replace("              ", "    ")
          if text.count(old_date) != 1:
              raise SystemExit("statewideProcurementParser.ts: date normalization mismatch")
          text = text.replace(old_date, new_date, 1)

          parser_marker = "function queryNativeId(url: URL): string | undefined {\n"
          bulletin_parser = r'''function sectionValue(
            text: string,
            startLabels: readonly string[],
            endLabels: readonly string[],
          ): string | undefined {
            const starts = startLabels.map((value) => value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
            const ends = endLabels.map((value) => value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
            const match = text.match(new RegExp(`(?:^|\\n)\\s*(?:${starts})\\s*:?\\s*([\\s\\S]*?)(?=\\n\\s*(?:${ends})\\s*:?|$)`, "i"));
            const value = match?.[1]?.replace(/\\n{2,}/g, "\\n").trim();
            return value || undefined;
          }

          function parseLabeledBulletinRecords(
            content: string,
            config: StatewidePortalConfig,
            pageUrl: string,
            listingPage: number,
          ): StatewideListingRecord[] {
            const text = statewideHtmlToText(content);
            if (!/\\bREFERENCE NUMBER\\s*:/i.test(text) || !/Date This Solicitation Was Posted\\s*:/i.test(text)) return [];

            const blocks = text.split(/\\n(?=\\s*(?:[-*•]\\s*)?REFERENCE NUMBER\\s*:)/i);
            const records: StatewideListingRecord[] = [];
            for (const block of blocks) {
              const referenceNumber = labelValue(block, ["REFERENCE NUMBER"]);
              const solicitationNumber = labelValue(block, ["Solicitation Number", "Event ID"]);
              const title = labelValue(block, ["Title", "Solicitation Title"]);
              if (!title || (!referenceNumber && !solicitationNumber)) continue;

              const deadline = parseDate(labelValue(block, [
                "Response to this solicitation is due no later than",
                "Response Due Date",
                "Due Date",
              ]), true);
              if (!isActive("Open", deadline)) continue;

              const agency = labelValue(block, ["Purchasing Agency", "Agency", "Department"]) || config.buyerName;
              const nativeId = solicitationNumber || referenceNumber as string;
              const description = sectionValue(
                block,
                ["Description of Work", "Notes"],
                ["Date This Solicitation Was Posted", "Category Codes"],
              );
              records.push({
                nativeId,
                title,
                agency,
                department: agency === config.buyerName ? undefined : agency,
                status: "Open",
                postedDate: parseDate(labelValue(block, ["Date This Solicitation Was Posted", "Posted Date"])),
                responseDeadline: deadline,
                solicitationNumber: solicitationNumber || referenceNumber || nativeId,
                type: inferType(`${title} ${description ?? ""}`),
                description,
                detailUrl: pageUrl,
                documentUrls: [],
                listingPage,
              });
            }
            return records;
          }

          '''
          if text.count(parser_marker) != 1:
              raise SystemExit("statewideProcurementParser.ts: queryNativeId marker mismatch")
          text = text.replace(parser_marker, bulletin_parser + parser_marker, 1)
          table_marker = "  const tableRecords = parseTableRecords(content, config, pageUrl, listingPage);\n"
          if text.count(table_marker) != 1:
              raise SystemExit("statewideProcurementParser.ts: table marker mismatch")
          text = text.replace(table_marker, "  records.push(...parseLabeledBulletinRecords(content, config, pageUrl, listingPage));\n" + table_marker, 1)
          path.write_text(text)

          # Move Minnesota to the complete official OSP bulletin while retaining SWIFT as an official fallback.
          path = Path("api-server/src/lib/providers/statewideProcurementConfigs.ts")
          text = path.read_text()
          pattern = re.compile(r'  state\("mn-swift",[\s\S]*?\n  \}\),\n  state\("mo-missouribuys"')
          replacement = '''  state("mn-swift", "State of Minnesota", "MN", "Minnesota OSP Goods and Services Solicitation Postings", "state_html", "https://osp.admin.mn.gov/GS-auto", "Minnesota OSP Solicitation Postings", {
            alternateListingUrls: [
              "https://mn.gov/admin/osp/vendors/solicitations-and-contract-opportunities/",
              "https://guest.supplier.systems.state.mn.us/psc/fmssupap/SUPPLIER/ERP/c/SCP_PUBLIC_MENU_FL.SCP_PUB_BID_CMP_FL.GBL?PAGE=SCP_PUB_BIDLIST_FL",
            ],
            allowedOrigins: ["https://mn.gov", "https://guest.supplier.systems.state.mn.us"],
            requestTimeoutMs: 30_000,
            maxRetries: 1,
            maxPages: 3,
          }),
          state("mo-missouribuys"'''.replace("          ", "  ")
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"statewideProcurementConfigs.ts: Minnesota block matches={count}")
          path.write_text(text)

          # Register OregonBuys on the mature dedicated Periscope/BSO listing-detail adapter.
          path = Path("api-server/src/lib/providers/bsoPortal.ts")
          text = path.read_text()
          text = text.replace("class BsoPortalProvider implements DataSourceProvider {", "export class BsoPortalProvider implements DataSourceProvider {", 1)
          text = text.replace("function bsoConfig(\n", "export function bsoConfig(\n", 1)
          record_start = text.index("export const bsoPortalProviders")
          close = text.rfind("\n};")
          if close <= record_start or '"or-oregonbuys"' in text[record_start:]:
              raise SystemExit("bsoPortal.ts: provider record marker mismatch")
          oregon = '''
            "or-oregonbuys": new BsoPortalProvider(
              bsoConfig(
                "or-oregonbuys",
                "OregonBuys",
                "OR",
                "https://oregonbuys.gov/bso/",
              ),
            ),'''.replace("            ", "  ")
          path.write_text(text[:close] + oregon + text[close:])

          # Route the production statewide registry through the specialized Oregon provider.
          path = Path("api-server/src/lib/providers/statewideProcurementPortals.ts")
          text = path.read_text()
          import_marker = 'import {\n  extractSameOriginPaginationUrls,\n  positiveIntegerEnv,\n} from "./officialPortalHttp";\n'
          import_replacement = 'import { bsoPortalProviders } from "./bsoPortal";\nimport {\n  describeOfficialPortalRequestError,\n  extractSameOriginPaginationUrls,\n  positiveIntegerEnv,\n} from "./officialPortalHttp";\n'
          if text.count(import_marker) != 1:
              raise SystemExit("statewideProcurementPortals.ts: import marker mismatch")
          text = text.replace(import_marker, import_replacement, 1)
          old_error = '''    if (lastError instanceof Error) {
              if (lastError.name === "AbortError") throw new Error(`${label} timed out after ${timeoutMs}ms`);
              throw lastError;
            }
            throw new Error(`${label} request failed`);'''.replace("            ", "    ")
          new_error = '''    throw new Error(describeOfficialPortalRequestError(lastError, label, timeoutMs));'''
          if text.count(old_error) != 1:
              raise SystemExit("statewideProcurementPortals.ts: error block mismatch")
          text = text.replace(old_error, new_error, 1)
          old_registry = '''export const statewideProcurementProviders: Record<string, StatewideProcurementProvider> = Object.fromEntries(
            STATEWIDE_PORTAL_CONFIGS.map((config) => [config.portalId, new StatewideProcurementProvider(config)]),
          );

          export function statewideProcurementProvider(portalId: string): StatewideProcurementProvider | undefined {
            return statewideProcurementProviders[portalId];
          }'''.replace("          ", "")
          new_registry = '''export const statewideProcurementProviders: Record<string, DataSourceProvider> = Object.fromEntries(
            STATEWIDE_PORTAL_CONFIGS.map((config) => [
              config.portalId,
              bsoPortalProviders[config.portalId] ?? new StatewideProcurementProvider(config),
            ]),
          );

          export function statewideProcurementProvider(portalId: string): DataSourceProvider | undefined {
            return statewideProcurementProviders[portalId];
          }'''.replace("          ", "")
          if text.count(old_registry) != 1:
              raise SystemExit("statewideProcurementPortals.ts: registry block mismatch")
          path.write_text(text.replace(old_registry, new_registry, 1))

          # Apply the same detailed network errors to Cal eProcure's session implementation.
          path = Path("api-server/src/lib/providers/calEprocure.ts")
          text = path.read_text()
          import_old = '''import {
            extractSameOriginPaginationUrls,
            positiveIntegerEnv,
            sameOriginUrl,
          } from "./officialPortalHttp";'''.replace("          ", "")
          import_new = '''import {
            describeOfficialPortalRequestError,
            extractSameOriginPaginationUrls,
            positiveIntegerEnv,
            sameOriginUrl,
          } from "./officialPortalHttp";'''.replace("          ", "")
          if text.count(import_old) != 1:
              raise SystemExit("calEprocure.ts: import mismatch")
          text = text.replace(import_old, import_new, 1)
          cal_old = '''    if (lastError instanceof Error) {
              if (lastError.name === "AbortError") throw new Error(`${label} timed out after ${timeoutMs}ms`);
              throw lastError;
            }
            throw new Error(`${label} request failed`);'''.replace("            ", "    ")
          cal_new = '''    throw new Error(describeOfficialPortalRequestError(lastError, label, timeoutMs));'''
          if text.count(cal_old) != 1:
              raise SystemExit("calEprocure.ts: error block mismatch")
          path.write_text(text.replace(cal_old, cal_new, 1))

          # Add regression coverage for Minnesota and the Oregon provider override.
          path = Path("api-server/src/lib/providers/__tests__/statewideProcurementPortals.test.ts")
          text = path.read_text()
          test_import = 'import { describe, it } from "node:test";\n'
          if text.count(test_import) != 1:
              raise SystemExit("statewide test: import marker mismatch")
          text = text.replace(test_import, test_import + 'import { bsoPortalProviders } from "../bsoPortal";\n', 1)
          text = text.replace('const WI = config("wi-vendornet");\n', 'const WI = config("wi-vendornet");\nconst MN = config("mn-swift");\n', 1)
          manifest_marker = '''  it("combines with the seven existing specialized statewide adapters to cover exactly 50 states", () => {'''
          override_test = '''  it("routes OregonBuys through the dedicated Periscope BSO adapter", () => {
            assert.equal(statewideProcurementProviders["or-oregonbuys"], bsoPortalProviders["or-oregonbuys"]);
          });

          '''.replace("          ", "  ")
          if text.count(manifest_marker) != 1:
              raise SystemExit("statewide test: manifest marker mismatch")
          text = text.replace(manifest_marker, override_test + manifest_marker, 1)
          parser_end = '''  it("parses custom VendorNet-style rows and direct solicitation documents", () => {'''
          mn_test = '''  it("parses Minnesota OSP labeled solicitation bulletin records", () => {
            const html = `<main>
              <div>REFERENCE NUMBER: 37413</div>
              <div>Purchasing Agency: Natural Resources Department</div>
              <div>Solicitation Number: 2000018497</div>
              <div>Title: DNR RFB Kawishiwi Falls Parking Lot</div>
              <div>Response to this solicitation is due no later than: 07/28/99 at 2:00pm</div>
              <div>Description of Work: Bituminous parking lot improvements.</div>
              <div>Date This Solicitation Was Posted: 07/17/99 at 4:10pm</div>
              <div>Category Codes: 72103301</div>
            </main>`;
            const rows = parseStatewideListingContent(html, MN);
            assert.equal(rows.length, 1);
            assert.equal(rows[0]!.nativeId, "2000018497");
            assert.equal(rows[0]!.agency, "Natural Resources Department");
            assert.equal(rows[0]!.title, "DNR RFB Kawishiwi Falls Parking Lot");
            assert.equal(rows[0]!.detailUrl, MN.listingUrl);
          });

          '''.replace("          ", "  ")
          if text.count(parser_end) != 1:
              raise SystemExit("statewide test: parser marker mismatch")
          path.write_text(text.replace(parser_end, mn_test + parser_end, 1))
          PY

      - name: Validate focused statewide recovery
        shell: bash
        run: |
          pnpm run typecheck:libs
          pnpm --filter @workspace/api-server exec tsc -p tsconfig.statewide.json --noEmit
          pnpm --filter @workspace/scripts exec tsx --test \
            ../api-server/src/lib/providers/__tests__/statewideProcurementPortals.test.ts \
            ../api-server/src/lib/providers/__tests__/statewideProcurementHotfix.test.ts \
            ../api-server/src/lib/providers/__tests__/statewideProcurementContentSignals.test.ts \
            ../api-server/src/lib/providers/__tests__/statewideProcurementPlatformParsers.test.ts

      - name: Commit recovery batch and remove bootstrap
        shell: bash
        run: |
          rm .github/workflows/deep-recovery-bootstrap.yml
          git config user.name "openai-agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git add -A
          git commit -m "fix: recover Minnesota bulletin and OregonBuys adapter"
          git push origin HEAD:agent/statewide-blocked-deep-recovery
