name: Research all RFP portals

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/actual-portal-research
    paths:
      - scripts/research-all-rfp-portals.ts
      - scripts/merge-portal-research.ts
      - .github/workflows/research-all-rfp-portals.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/research-all-rfp-portals.ts
      - scripts/merge-portal-research.ts
      - .github/workflows/research-all-rfp-portals.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: research-all-rfp-portals
  cancel-in-progress: true

jobs:
  research:
    name: Research shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/actual-portal-research

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Research portal shard
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/portal-research-shards"
          pnpm --filter @workspace/scripts exec tsx ../scripts/research-all-rfp-portals.ts \
            --shard "${{ matrix.shard }}" \
            --shards 8 \
            --concurrency 4 \
            --max-evidence-pages 12 \
            --out "$GITHUB_WORKSPACE/portal-research-shards/portal-research-${{ matrix.shard }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: portal-research-${{ matrix.shard }}
          path: ${{ github.workspace }}/portal-research-shards/portal-research-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 14

  combine:
    name: Combine research and update catalog
    needs: research
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/actual-portal-research
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          pattern: portal-research-*
          path: ${{ github.workspace }}/portal-research-shards
          merge-multiple: true

      - name: Merge all 461 research records
        run: |
          pnpm --filter @workspace/scripts exec tsx ../scripts/merge-portal-research.ts \
            --input-dir "$GITHUB_WORKSPACE/portal-research-shards" \
            --audit-out "$GITHUB_WORKSPACE/artifacts/portal-research/portal-research-audit.json" \
            --summary-out "$GITHUB_WORKSPACE/artifacts/portal-research/portal-research-summary.json" \
            --generated-out "$GITHUB_WORKSPACE/api-server/src/lib/providers/portalResearch.generated.ts" \
            --catalog "$GITHUB_WORKSPACE/api-server/src/lib/providers/directRfpPortalRelevanceCatalog.ts"

      - name: Format generated files
        run: |
          pnpm exec prettier --write \
            api-server/src/lib/providers/directRfpPortalRelevanceCatalog.ts \
            api-server/src/lib/providers/portalResearch.generated.ts \
            artifacts/portal-research/portal-research-audit.json \
            artifacts/portal-research/portal-research-summary.json

      - name: Validate catalog and types
        run: |
          pnpm run rfp:sources:validate
          pnpm run public-portals:validate
          pnpm --filter @workspace/api-server run typecheck
          git diff --check

      - name: Verify complete research coverage
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const summary = JSON.parse(fs.readFileSync('artifacts/portal-research/portal-research-summary.json', 'utf8'));
          if (summary.totalCatalogPortals !== summary.totalResearchRecords) throw new Error('Research coverage is incomplete');
          if (summary.missingPortalIds.length || summary.unknownPortalIds.length || summary.duplicatePortalIds.length) {
            throw new Error(JSON.stringify(summary, null, 2));
          }
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Commit completed research
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            api-server/src/lib/providers/directRfpPortalRelevanceCatalog.ts \
            api-server/src/lib/providers/portalResearch.generated.ts \
            artifacts/portal-research/portal-research-audit.json \
            artifacts/portal-research/portal-research-summary.json
          if git diff --cached --quiet; then
            echo "No research changes to commit"
          else
            git commit -m "Complete external evidence research for all RFP portals"
            git push origin HEAD:chatgpt/actual-portal-research
          fi

      - name: Open or update pull request
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr view chatgpt/actual-portal-research --json number >/dev/null 2>&1; then
            gh pr edit chatgpt/actual-portal-research \
              --title "Replace inferred portal rankings with real evidence research" \
              --body-file artifacts/portal-research/portal-research-summary.json
          else
            gh pr create \
              --base main \
              --head chatgpt/actual-portal-research \
              --title "Replace inferred portal rankings with real evidence research" \
              --body "Completed external research for every direct RFP portal. The audit and summary files record the queries, official pages inspected, accepted evidence, rejected candidates, errors, and final research status for each portal. Generic portal homepages are not treated as Occu-Med relevance evidence."
          fi
