name: Product build

on:
  pull_request:
    paths:
      - "api-server/**"
      - "intel-suite/**"
      - "lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/product-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RFP_DATABASE_URL: postgresql://test:test@localhost:5432/rfp_core
      INTEL_DATABASE_URL: postgresql://test:test@localhost:5432/intel
      AUTH_DATABASE_URL: postgresql://test:test@localhost:5432/auth
      APP_DATABASE_URL: postgresql://test:test@localhost:5432/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Opportunity decision regressions
        run: pnpm --filter @workspace/api-server exec node --import tsx --test src/lib/__tests__/limitedProviderPool.test.ts src/lib/ingestion/__tests__/providerRunner.test.ts src/lib/search/__tests__/structuredOpportunityDecision.test.ts

      - name: Build production applications
        run: pnpm run build:prod
