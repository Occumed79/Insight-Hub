name: Product build

on:
  pull_request:
    paths:
      - "api-server/**"
      - "intel-suite/**"
      - "lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/product-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-security-lock:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'hardening/release-security-governance'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Resolve patched lockfile
        run: pnpm install --no-frozen-lockfile --lockfile-only

      - name: Commit lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Refresh lockfile for patched dependencies"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rfp_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d rfp_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RFP_DATABASE_URL: postgresql://test:test@localhost:5432/rfp_core
      INTEL_DATABASE_URL: postgresql://test:test@localhost:5432/intel
      AUTH_DATABASE_URL: postgresql://test:test@localhost:5432/auth
      APP_DATABASE_URL: postgresql://test:test@localhost:5432/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare logical integration databases
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U test -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE intel;
          CREATE DATABASE auth;
          CREATE DATABASE app;
          SQL

      - name: Typecheck
        run: pnpm run typecheck

      - name: Hardening regressions
        run: pnpm --filter @workspace/api-server run test:hardening

      - name: Full-scope acceptance benchmark
        run: pnpm --filter @workspace/api-server run test:acceptance

      - name: Real Postgres routing integration
        run: pnpm --filter @workspace/api-server run test:db-integration

      - name: Opportunity ingestion regressions
        run: pnpm --filter @workspace/api-server run test:ingestion

      - name: Opportunity quality regressions
        run: pnpm --filter @workspace/api-server run test:quality

      - name: Frontend opportunity regressions
        run: pnpm --filter @workspace/intel-suite run test:quality

      - name: Build production applications
        run: pnpm run build:prod

      - name: Install Playwright Chromium
        run: pnpm --filter @workspace/api-server exec playwright install --with-deps chromium

      - name: Browser acceptance - intelligence workspaces and UI hardening
        shell: bash
        run: |
          set -euo pipefail
          PORT=4173 NODE_ENV=production pnpm --filter @workspace/intel-suite run serve >/tmp/insight-hub-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true; cat /tmp/insight-hub-preview.log || true' EXIT
          INSIGHT_E2E_BASE_URL=http://127.0.0.1:4173 node api-server/scripts/opportunities-browser-smoke.mjs
          INSIGHT_E2E_BASE_URL=http://127.0.0.1:4173 node api-server/scripts/ui-hardening-browser-smoke.mjs
