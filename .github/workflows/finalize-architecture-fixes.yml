name: Finalize architecture fixes

on:
  push:
    branches:
      - agent/provider-boundary-cleanup

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/provider-boundary-cleanup
          fetch-depth: 0

      - name: Apply deterministic final fixes
        run: python3 scripts/finalize_architecture_fixes.py

      - name: Commit final fixes
        shell: bash
        run: |
          rm -f scripts/finalize_architecture_fixes.py
          rm -f .github/workflows/finalize-architecture-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize provider and portal cleanup"
          git push origin HEAD:agent/provider-boundary-cleanup
