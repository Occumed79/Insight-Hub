name: Audit core direct RFP portals

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - scripts/audit-core-direct-rfp-portals.mjs
      - scripts/run-core-direct-rfp-audit.mjs
      - api-server/src/lib/providers/directRfpPortals.ts
      - .github/workflows/audit-core-direct-rfp-portals.yml

permissions:
  contents: write

jobs:
  live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit the unpruned core catalog
        run: |
          rm -rf audit-output/core-direct-rfp-portals
          node scripts/run-core-direct-rfp-audit.mjs
          mkdir -p docs/audits
          cp audit-output/core-direct-rfp-portals/audit.md \
            docs/audits/core-direct-rfp-portals-pre-prune-2026-07-13.md

      - name: Strictly prune until the retained catalog is all live
        run: |
          set -euo pipefail
          source_file="api-server/src/lib/providers/directRfpPortals.ts"
          output_dir="audit-output/core-direct-rfp-portals"
          converged=false

          for pass in $(seq 1 20); do
            echo "Applying strict core prune pass ${pass}"
            cp "$output_dir/directRfpPortals.pruned.ts" "$source_file"
            rm -rf "$output_dir"
            node scripts/run-core-direct-rfp-audit.mjs

            non_live=$(node --input-type=module <<'NODE'
          import fs from "node:fs";
          const report = JSON.parse(
            fs.readFileSync("audit-output/core-direct-rfp-portals/audit.json", "utf8"),
          );
          const count = Object.entries(report.summary.statusCounts)
            .filter(([status]) => status !== "live")
            .reduce((sum, [, value]) => sum + value, 0);
          process.stdout.write(String(count));
          NODE
            )

            echo "Non-live records after pass ${pass}: ${non_live}"
            if [ "$non_live" = "0" ]; then
              converged=true
              break
            fi
          done

          if [ "$converged" != "true" ]; then
            echo "Core pruning did not converge within 20 passes." >&2
            exit 1
          fi

          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const report = JSON.parse(
            fs.readFileSync("audit-output/core-direct-rfp-portals/audit.json", "utf8"),
          );
          const nonLive = Object.entries(report.summary.statusCounts)
            .filter(([status, count]) => status !== "live" && count > 0);
          if (nonLive.length > 0) {
            throw new Error(`Final core audit still contains non-live records: ${JSON.stringify(nonLive)}`);
          }
          console.log(`Final core audit passed: ${report.summary.retained} of ${report.auditScope.records} records are retained.`);
          NODE

          cp "$output_dir/audit.md" \
            docs/audits/core-direct-rfp-portals-post-prune-2026-07-13.md

      - name: Commit pruned core catalog to PR
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-server/src/lib/providers/directRfpPortals.ts
          git add docs/audits/core-direct-rfp-portals-*.md
          if git diff --cached --quiet; then
            echo "No additional core catalog changes were required."
          else
            git commit -m "Prune unverified core direct RFP portals"
            local_sha=$(git rev-parse HEAD)
            set +e
            git push origin "HEAD:${TARGET_BRANCH}"
            push_status=$?
            set -e
            remote_sha=$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)
            if [ "$remote_sha" != "$local_sha" ]; then
              exit "$push_status"
            fi
          fi

      - name: Publish final audit summary
        if: always()
        run: |
          if [ -f audit-output/core-direct-rfp-portals/audit.md ]; then
            cat audit-output/core-direct-rfp-portals/audit.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload final audit and pruned file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-direct-rfp-portals-audit
          path: audit-output/core-direct-rfp-portals/
          if-no-files-found: error
          retention-days: 14
