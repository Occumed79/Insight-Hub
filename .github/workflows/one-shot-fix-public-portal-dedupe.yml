name: Fix public portal URL dedupe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-validate-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unify-public-portal-serper
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Preserve query-string opportunity IDs during deduplication
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path("api-server/src/lib/providers/publicPortalProviders/index.ts")
          text = path.read_text()
          old = 'return `url:${parsed.hostname.replace(/^www\\./, "").toLowerCase()}${parsed.pathname.replace(/\\/$/, "").toLowerCase()}`;'
          new = 'return `url:${parsed.hostname.replace(/^www\\./, "").toLowerCase()}${parsed.pathname.replace(/\\/$/, "").toLowerCase()}${parsed.search.toLowerCase()}`;'
          if old not in text:
              raise SystemExit("Expected URL dedupe expression not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Production build
        run: pnpm run build:prod

      - name: Verify query-string preservation
        run: grep -F 'parsed.search.toLowerCase()' api-server/src/lib/providers/publicPortalProviders/index.ts

      - name: Commit correction and remove temporary workflow
        run: |
          rm .github/workflows/one-shot-fix-public-portal-dedupe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve portal query IDs during deduplication"
          git push origin HEAD:agent/unify-public-portal-serper
