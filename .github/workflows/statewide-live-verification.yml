name: Statewide live verification

on:
  pull_request:
    paths:
      - "api-server/src/lib/providers/**"
      - "api-server/tsconfig.statewide.json"
      - "scripts/src/run-statewide-live-verification.ts"
      - "package.json"
      - ".github/workflows/statewide-live-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare verification output
        run: mkdir -p artifacts/statewide-live-verification

      - name: Typecheck statewide provider modules
        run: |
          set +e
          set -o pipefail
          {
            pnpm run typecheck:libs
            pnpm --filter @workspace/api-server exec tsc -p tsconfig.statewide.json --noEmit
          } 2>&1 | tee artifacts/statewide-live-verification/typecheck.log
          code=${PIPESTATUS[0]}
          echo "$code" > artifacts/statewide-live-verification/typecheck.exit
          exit 0

      - name: Run statewide provider tests
        run: |
          set +e
          set -o pipefail
          pnpm --filter @workspace/scripts exec tsx --test \
            ../api-server/src/lib/providers/__tests__/deepRecoveryProviders.test.ts \
            ../api-server/src/lib/providers/__tests__/openGovCountyExtensions.test.ts \
            ../api-server/src/lib/providers/__tests__/portalHealthRotation.test.ts \
            ../api-server/src/lib/providers/__tests__/productionSourceRecovery.test.ts \
            ../api-server/src/lib/providers/__tests__/statePlatformAdapters.test.ts \
            ../api-server/src/lib/providers/__tests__/statewideProcurementPortals.test.ts \
            ../api-server/src/lib/providers/__tests__/statewideProcurementHotfix.test.ts \
            ../api-server/src/lib/providers/__tests__/statewideProcurementContentSignals.test.ts \
            ../api-server/src/lib/providers/__tests__/statewideProcurementPlatformParsers.test.ts \
            2>&1 | tee artifacts/statewide-live-verification/focused-tests.log
          code=${PIPESTATUS[0]}
          echo "$code" > artifacts/statewide-live-verification/focused-tests.exit
          exit 0

      - name: Run live 50-state sweep
        env:
          STATEWIDE_LIVE_CONCURRENCY: "8"
          STATEWIDE_LIVE_REPORT_DIR: ${{ github.workspace }}/artifacts/statewide-live-verification
          STATEWIDE_PORTAL_REQUEST_TIMEOUT_MS: "30000"
          STATEWIDE_PORTAL_MAX_RETRIES: "1"
          STATEWIDE_PORTAL_MAX_PAGES: "4"
          STATEWIDE_PORTAL_MAX_RESULTS: "2"
          STATEWIDE_PORTAL_DETAIL_CONCURRENCY: "2"
          BSO_REQUEST_TIMEOUT_MS: "30000"
          BSO_MAX_RETRIES: "1"
        run: |
          set +e
          set -o pipefail
          pnpm statewide:verify-live 2>&1 | tee artifacts/statewide-live-verification/live-sweep.log
          code=${PIPESTATUS[0]}
          echo "$code" > artifacts/statewide-live-verification/live-sweep.exit
          exit 0

      - name: Publish sweep summary
        if: always()
        run: |
          if [ -f artifacts/statewide-live-verification/statewide-live-verification.md ]; then
            cat artifacts/statewide-live-verification/statewide-live-verification.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statewide-live-verification
          path: artifacts/statewide-live-verification
          if-no-files-found: error

      - name: Enforce validation results
        if: always()
        run: |
          failures=0
          if [ "$(cat artifacts/statewide-live-verification/typecheck.exit 2>/dev/null || echo 1)" != "0" ]; then
            echo "Focused statewide typecheck failed"
            failures=1
          fi
          if [ "$(cat artifacts/statewide-live-verification/focused-tests.exit 2>/dev/null || echo 1)" != "0" ]; then
            echo "Focused tests failed"
            failures=1
          fi
          if [ "$(cat artifacts/statewide-live-verification/live-sweep.exit 2>/dev/null || echo 1)" != "0" ]; then
            echo "Live sweep found BAD_ENDPOINT/PARSER_FAILURE or could not complete"
            failures=1
          fi
          exit "$failures"
