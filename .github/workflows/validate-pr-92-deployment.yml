name: Validate PR 92 deployment hardening

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  validate-and-cleanup:
    if: github.event.pull_request.number == 92
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/harden-neon-deployment
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Validate Render YAML
        run: ruby -e 'require "yaml"; YAML.load_file("render.yaml")'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Production build
        run: pnpm run build:prod

      - name: Remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/validate-pr-92-deployment.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-pr-92-deployment.yml
          git commit -m "Remove temporary PR 92 validation workflow"
          git push origin HEAD:agent/harden-neon-deployment
