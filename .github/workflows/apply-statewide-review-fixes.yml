name: Apply statewide recovery review fixes

on:
  push:
    branches:
      - agent/statewide-19-recovery
    paths:
      - .github/workflows/apply-statewide-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: agent/statewide-19-recovery
          fetch-depth: 0

      - name: Apply review fixes
        run: python .github/scripts/apply-statewide-review-fixes.py

      - name: Commit review fixes
        shell: bash
        run: |
          git config user.name "openai-agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git add -A
          git commit -m "fix: bound statewide recovery budgets and challenge classification"
          git push origin HEAD:agent/statewide-19-recovery
