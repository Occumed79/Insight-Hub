name: Deep reliability source patch

on:
  push:
    branches:
      - hardening/deep-reliability-beast-pass
    paths:
      - .github/workflows/deep-reliability-source-patch.yml

permissions:
  contents: write

jobs:
  patch-existing-runtime:
    if: ${{ !contains(github.event.head_commit.message, 'Apply deep reliability runtime patches') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/deep-reliability-beast-pass
          fetch-depth: 0

      - name: Patch existing reliability paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # Preserve global run-timeout semantics and stop canonical processing as soon as
          # the parent run is aborted. A user stop remains cancellation; a run deadline
          # remains a timeout instead of being downgraded to cancellation.
          manual = "api-server/src/lib/ingestion/manualIngestion.ts"
          replace_once(
              manual,
              '''    if (runSignal.aborted) throw new RunCancelledError();\n    throw error;''',
              '''    if (runSignal.aborted) {\n      const reason = runSignal.reason;\n      if (reason instanceof RunTimeoutError || reason instanceof RunCancelledError) {\n        throw reason;\n      }\n      throw new RunCancelledError();\n    }\n    throw error;''',
          )
          replace_once(
              manual,
              '''  const runTimeout = setTimeout(\n    () => runController.abort(new RunTimeoutError()),\n    RUN_DEADLINE_MS,\n  );\n  const runErrors: string[] = [];''',
              '''  const runTimeout = setTimeout(\n    () => runController.abort(new RunTimeoutError()),\n    RUN_DEADLINE_MS,\n  );\n  runTimeout.unref?.();\n  const runErrors: string[] = [];''',
          )
          replace_once(
              manual,
              '''        for (const record of result.records) {\n          if (await cancellationRequested(runId)) throw new RunCancelledError();''',
              '''        for (const record of result.records) {\n          if (runController.signal.aborted) {\n            throw runController.signal.reason ?? new RunCancelledError();\n          }\n          if (await cancellationRequested(runId)) throw new RunCancelledError();''',
          )

          # Wire the already-existing AbortSignal through the provider pool and AI stage,
          # reject cancellation as cancellation rather than a partial web-intelligence
          # error, and eliminate module-load-time deadline drift.
          web = "api-server/src/lib/search/webIntelligence.ts"
          replace_once(web, "const NOW = new Date();\n", "")
          replace_once(
              web,
              '''function isExpiredDeadline(deadline: Date | undefined | null): boolean {\n  if (!deadline) return false;\n  const oneDayAgo = new Date(NOW.getTime() - 24 * 60 * 60 * 1000);\n  return deadline < oneDayAgo;\n}\n''',
              '''function isExpiredDeadline(deadline: Date | undefined | null): boolean {\n  if (!deadline) return false;\n  const oneDayAgo = new Date(Date.now() - 24 * 60 * 60 * 1000);\n  return deadline < oneDayAgo;\n}\n\nfunction throwIfAborted(signal?: AbortSignal): void {\n  if (signal?.aborted) {\n    throw signal.reason ?? new Error("Web intelligence discovery aborted");\n  }\n}\n''',
          )
          replace_once(
              web,
              '''): Promise<WebIntelligenceResult> {\n  const errors: string[] = [];''',
              '''): Promise<WebIntelligenceResult> {\n  throwIfAborted(options.signal);\n  const errors: string[] = [];''',
          )
          replace_once(
              web,
              '''  const useSelfHostedSearch = options.useSelfHostedSearch !== false; // Default to true for stable provider\n  const useSelfHostedCrawler = options.useSelfHostedCrawler !== false; // Default to true for stable provider''',
              '''  const useSelfHostedSearch = options.useSelfHostedSearch === true;\n  const useSelfHostedCrawler = options.useSelfHostedCrawler === true;''',
          )
          replace_once(
              web,
              '''  for (const query of discoveryQueries) {\n    const attempts:''',
              '''  for (const query of discoveryQueries) {\n    throwIfAborted(options.signal);\n    const attempts:''',
          )
          replace_once(
              web,
              '''    const result = await runLimitedProviderPool(\n      "opportunity-web-discovery",\n      attempts,\n      (value) => value.length > 0,\n    );''',
              '''    const result = await runLimitedProviderPool(\n      "opportunity-web-discovery",\n      attempts,\n      (value) => value.length > 0,\n      { signal: options.signal },\n    );''',
          )
          replace_once(
              web,
              '''  for (const { candidate, index } of toEnrich) {\n    const enrichmentAttempts = [''',
              '''  for (const { candidate, index } of toEnrich) {\n    throwIfAborted(options.signal);\n    const enrichmentAttempts = [''',
          )
          replace_once(
              web,
              '''    const enriched = await runLimitedProviderPool(\n      "opportunity-page-enrichment",\n      enrichmentAttempts,\n      (value) => typeof value === "string" && value.length > 200,\n    );''',
              '''    const enriched = await runLimitedProviderPool(\n      "opportunity-page-enrichment",\n      enrichmentAttempts,\n      (value) => typeof value === "string" && value.length > 200,\n      { signal: options.signal },\n    );''',
          )
          replace_once(
              web,
              '''        enrichedCandidates.map((c) => ({\n          title: c.title,\n          url: c.url,\n          content: c.content,\n        })),\n      );''',
              '''        enrichedCandidates.map((c) => ({\n          title: c.title,\n          url: c.url,\n          content: c.content,\n        })),\n        options.signal,\n      );''',
          )
          replace_once(
              web,
              '''  } catch (err: any) {\n    errors.push(`Web intelligence error: ${err.message}`);\n  }\n\n  return {''',
              '''  } catch (err: any) {\n    if (options.signal?.aborted) {\n      throw options.signal.reason ?? err;\n    }\n    errors.push(`Web intelligence error: ${err.message}`);\n  }\n\n  throwIfAborted(options.signal);\n  return {''',
          )

          # Prevent stale summary A from overwriting newly opened summary B, and abort
          # poll requests when the polling effect is replaced/unmounted.
          ui = "intel-suite/src/pages/portal/opportunities.tsx"
          replace_once(
              ui,
              '''  const activeRunIds = useRef(new Set<string>());\n  const notifiedRunIds = useRef(new Set<string>());''',
              '''  const activeRunIds = useRef(new Set<string>());\n  const notifiedRunIds = useRef(new Set<string>());\n  const summaryRequestRef = useRef<{\n    opportunityId: string;\n    controller: AbortController;\n  } | null>(null);''',
          )
          replace_once(
              ui,
              '''  useEffect(() => {\n    let cancelled = false;\n    let timer: ReturnType<typeof setTimeout> | undefined;\n    const poll = async () => {''',
              '''  useEffect(() => {\n    let cancelled = false;\n    let timer: ReturnType<typeof setTimeout> | undefined;\n    const controller = new AbortController();\n    const poll = async () => {''',
          )
          replace_once(
              ui,
              '''          {\n            cache: "no-store",\n            headers: { "Cache-Control": "no-cache" },\n          },''',
              '''          {\n            cache: "no-store",\n            headers: { "Cache-Control": "no-cache" },\n            signal: controller.signal,\n          },''',
          )
          replace_once(
              ui,
              '''    return () => {\n      cancelled = true;\n      if (timer) clearTimeout(timer);\n    };\n  }, [queryClient, toast, currentRun?.id, currentRun?.status]);''',
              '''    return () => {\n      cancelled = true;\n      controller.abort();\n      if (timer) clearTimeout(timer);\n    };\n  }, [queryClient, toast, currentRun?.id, currentRun?.status]);''',
          )
          old_summary = '''  const handleOpenSummary = async (opp: any) => {\n    setSelectedOpportunity(opp);\n    setSummaryOpen(true);\n    setSummaryLoading(true);\n    setSummaryError(null);\n    setSummaryData(null);\n\n    try {\n      const baseUrl = import.meta.env.BASE_URL?.replace(/\\/$/, "") ?? "";\n      const resp = await fetch(\n        `${baseUrl}/api/opportunities/${opp.id}/summary`,\n        { method: "POST" },\n      );\n      const data = await resp.json();\n      if (!resp.ok) {\n        throw new Error(data.reason || data.error || "Summary failed");\n      }\n      setSummaryData(data);\n    } catch (err: any) {\n      setSummaryError(err.message || "Summary failed");\n    } finally {\n      setSummaryLoading(false);\n    }\n  };'''
          new_summary = '''  const handleOpenSummary = async (opp: any) => {\n    summaryRequestRef.current?.controller.abort();\n    const controller = new AbortController();\n    summaryRequestRef.current = { opportunityId: opp.id, controller };\n\n    setSelectedOpportunity(opp);\n    setSummaryOpen(true);\n    setSummaryLoading(true);\n    setSummaryError(null);\n    setSummaryData(null);\n\n    try {\n      const baseUrl = import.meta.env.BASE_URL?.replace(/\\/$/, "") ?? "";\n      const resp = await fetch(\n        `${baseUrl}/api/opportunities/${opp.id}/summary`,\n        { method: "POST", signal: controller.signal },\n      );\n      const data = await resp.json();\n      if (!resp.ok) {\n        throw new Error(data.reason || data.error || "Summary failed");\n      }\n      if (summaryRequestRef.current?.opportunityId === opp.id) {\n        setSummaryData(data);\n      }\n    } catch (err: any) {\n      if (!controller.signal.aborted && summaryRequestRef.current?.opportunityId === opp.id) {\n        setSummaryError(err.message || "Summary failed");\n      }\n    } finally {\n      if (summaryRequestRef.current?.opportunityId === opp.id) {\n        setSummaryLoading(false);\n        summaryRequestRef.current = null;\n      }\n    }\n  };'''
          replace_once(ui, old_summary, new_summary)

          # Remove this one-shot edit workflow from the resulting branch commit.
          Path(".github/workflows/deep-reliability-source-patch.yml").unlink()
          PY

      - name: Commit surgical runtime fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Apply deep reliability runtime patches"
          git push origin HEAD:hardening/deep-reliability-beast-pass
