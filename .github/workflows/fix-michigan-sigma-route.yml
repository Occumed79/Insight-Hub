name: Apply Michigan SIGMA route correction

on:
  push:
    branches:
      - agent/statewide-19-recovery
    paths:
      - .github/workflows/fix-michigan-sigma-route.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: agent/statewide-19-recovery
          fetch-depth: 0

      - name: Correct Michigan SIGMA routes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("api-server/src/lib/providers/statewideProcurementConfigs.ts")
          text = path.read_text()
          old = '''  state("mi-sigma", "State of Michigan", "MI", "Michigan SIGMA Vendor Self-Service", "cgi_advantage", "https://sigma.michigan.gov/webapp/PRDVSS2X1/AltSelfService", "Michigan SIGMA VSS", {
              alternateListingUrls: ["https://sigma.michigan.gov/webapp/PRDVSS2X1/Advantage4"],'''.replace("              ", "    ")
          new = '''  state("mi-sigma", "State of Michigan", "MI", "Michigan SIGMA Vendor Self-Service", "cgi_advantage", "https://sigma.michigan.gov/PRDVSS1X1/Advantage4", "Michigan SIGMA VSS", {
              alternateListingUrls: ["https://sigma.michigan.gov/PRDVSS1X1/AltSelfService"],'''.replace("              ", "    ")
          if text.count(old) != 1:
              raise SystemExit(f"Expected one Michigan route block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          Path(".github/workflows/fix-michigan-sigma-route.yml").unlink()
          PY

      - name: Commit route correction
        shell: bash
        run: |
          git config user.name "openai-agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git add -A
          git commit -m "fix: use active Michigan SIGMA VSS route"
          git push origin HEAD:agent/statewide-19-recovery
