name: Deep reliability UI lifecycle

on:
  push:
    branches:
      - hardening/deep-reliability-beast-pass
    paths:
      - .github/workflows/deep-reliability-ui-lifecycle.yml

permissions:
  contents: write

jobs:
  patch-ui-lifecycle:
    if: ${{ !contains(github.event.head_commit.message, 'Harden opportunity UI request lifecycle') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/deep-reliability-beast-pass
          fetch-depth: 0
      - name: Patch existing UI lifecycle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"ambiguous replacement in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          ui = "intel-suite/src/pages/portal/opportunities.tsx"
          replace_once(
              ui,
              '''export default function OpportunitiesDashboard() {''',
              '''function rememberRunId(set: Set<string>, id: string, limit = 128): void {\n  set.add(id);\n  while (set.size > limit) {\n    const oldest = set.values().next().value as string | undefined;\n    if (!oldest) break;\n    set.delete(oldest);\n  }\n}\n\nexport default function OpportunitiesDashboard() {''',
          )
          replace_once(
              ui,
              '''  const [summaryError, setSummaryError] = useState<string | null>(null);\n\n  const { data: settings } = useGetSettings();''',
              '''  const [summaryError, setSummaryError] = useState<string | null>(null);\n\n  useEffect(() => {\n    return () => {\n      summaryRequestRef.current?.controller.abort();\n      summaryRequestRef.current = null;\n    };\n  }, []);\n\n  const { data: settings } = useGetSettings();''',
          )
          replace_once(
              ui,
              '''              activeRunIds.current.add(run.id);''',
              '''              rememberRunId(activeRunIds.current, run.id);''',
          )
          replace_once(
              ui,
              '''              notifiedRunIds.current.add(run.id);''',
              '''              rememberRunId(notifiedRunIds.current, run.id);''',
          )
          replace_once(
              ui,
              '''      <Dialog open={summaryOpen} onOpenChange={setSummaryOpen}>''',
              '''      <Dialog\n        open={summaryOpen}\n        onOpenChange={(open) => {\n          setSummaryOpen(open);\n          if (!open) {\n            summaryRequestRef.current?.controller.abort();\n            summaryRequestRef.current = null;\n            setSummaryLoading(false);\n          }\n        }}\n      >''',
          )
          replace_once(
              ui,
              '''                onClick={() => setSummaryOpen(false)}''',
              '''                onClick={() => {\n                  summaryRequestRef.current?.controller.abort();\n                  summaryRequestRef.current = null;\n                  setSummaryLoading(false);\n                  setSummaryOpen(false);\n                }}''',
          )

          Path(".github/workflows/deep-reliability-ui-lifecycle.yml").unlink()
          PY
      - name: Commit UI lifecycle fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden opportunity UI request lifecycle"
          git push origin HEAD:hardening/deep-reliability-beast-pass
