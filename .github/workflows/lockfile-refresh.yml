name: Lockfile consistency

on:
  pull_request:
    paths:
      - pnpm-workspace.yaml
      - "**/package.json"
      - pnpm-lock.yaml
      - .github/workflows/lockfile-refresh.yml
  push:
    branches: [main]
    paths:
      - pnpm-workspace.yaml
      - "**/package.json"
      - pnpm-lock.yaml
      - .github/workflows/lockfile-refresh.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Verify declared dependencies match lockfile
        run: pnpm install --frozen-lockfile --lockfile-only
