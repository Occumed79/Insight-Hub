name: Apply provider settings cache implementation

on:
  push:
    branches:
      - fix/provider-settings-query-storm
    paths:
      - .github/workflows/apply-provider-settings-cache.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rfp_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d rfp_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RFP_DATABASE_URL: postgresql://test:test@localhost:5432/rfp_core
      INTEL_DATABASE_URL: postgresql://test:test@localhost:5432/intel
      AUTH_DATABASE_URL: postgresql://test:test@localhost:5432/auth
      APP_DATABASE_URL: postgresql://test:test@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/provider-settings-query-storm
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Patch credential resolution and invalidation
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"marker not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          provider = "api-server/src/lib/config/providerConfig.ts"
          replace_once(
              provider,
              'import { settingsTable } from "@workspace/db/schema";\nimport { eq } from "drizzle-orm";\n',
              'import { settingsTable } from "@workspace/db/schema";\nimport { createCredentialSettingsCache } from "./credentialSettingsCache";\n\nexport { createCredentialSettingsCache };\n',
          )
          replace_once(
              provider,
              'export interface ResolvedCredential {\n',
              '''const credentialSettingsCache = createCredentialSettingsCache(async () => {\n  const rows = await db.select().from(settingsTable);\n  return new Map(rows.map((row) => [row.key, row.value]));\n});\n\nexport function invalidateCredentialSettingsCache(): void {\n  credentialSettingsCache.invalidate();\n}\n\nexport interface ResolvedCredential {\n''',
          )
          replace_once(
              provider,
              '''  try {\n    const rows = await db\n      .select()\n      .from(settingsTable)\n      .where(eq(settingsTable.key, dbKey));\n    const dbVal = rows[0]?.value;\n    if (dbVal && dbVal.trim()) {\n      return { value: dbVal.trim(), source: "database", key: dbKey };\n    }\n  } catch {\n''',
              '''  try {\n    const dbVal = (await credentialSettingsCache.get()).get(dbKey);\n    if (dbVal && dbVal.trim()) {\n      return { value: dbVal.trim(), source: "database", key: dbKey };\n    }\n  } catch {\n''',
          )

          settings = "api-server/src/routes/settings.ts"
          replace_once(
              settings,
              'import { resolveCredential } from "../lib/config/providerConfig";\n',
              'import { invalidateCredentialSettingsCache, resolveCredential } from "../lib/config/providerConfig";\n',
          )
          replace_once(
              settings,
              '    .onConflictDoUpdate({ target: settingsTable.key, set: { value } });\n}\n\nasync function removeSetting(key: string) {\n  await db.delete(settingsTable).where(eq(settingsTable.key, key));\n}\n',
              '    .onConflictDoUpdate({ target: settingsTable.key, set: { value } });\n  invalidateCredentialSettingsCache();\n}\n\nasync function removeSetting(key: string) {\n  await db.delete(settingsTable).where(eq(settingsTable.key, key));\n  invalidateCredentialSettingsCache();\n}\n',
          )

          providers = "api-server/src/routes/providers.ts"
          replace_once(
              providers,
              '  RFP_INGESTION_PROVIDER_NAMES,\n  resolveCredential,\n',
              '  RFP_INGESTION_PROVIDER_NAMES,\n  invalidateCredentialSettingsCache,\n  resolveCredential,\n',
          )
          replace_once(
              providers,
              '        await db.delete(settingsTable).where(eq(settingsTable.key, field.dbKey));\n        removedKeys.push(field.dbKey);\n',
              '        await db.delete(settingsTable).where(eq(settingsTable.key, field.dbKey));\n        invalidateCredentialSettingsCache();\n        removedKeys.push(field.dbKey);\n',
          )
          replace_once(
              providers,
              '          .onConflictDoUpdate({\n            target: settingsTable.key,\n            set: { value: normalized },\n          });\n        savedKeys.push(field.dbKey);\n',
              '          .onConflictDoUpdate({\n            target: settingsTable.key,\n            set: { value: normalized },\n          });\n        invalidateCredentialSettingsCache();\n        savedKeys.push(field.dbKey);\n',
          )

          package_path = Path("api-server/package.json")
          package = json.loads(package_path.read_text())
          script = package["scripts"]["test:hardening"]
          test_path = "src/lib/config/__tests__/providerConfigCache.test.ts"
          if test_path not in script:
              marker = "node --import tsx --test "
              if marker not in script:
                  raise SystemExit("test:hardening marker not found")
              script = script.replace(marker, marker + test_path + " ", 1)
              package["scripts"]["test:hardening"] = script
              package_path.write_text(json.dumps(package, indent=2) + "\n")
          PY
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare logical test databases
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U test -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE intel;
          CREATE DATABASE auth;
          CREATE DATABASE app;
          SQL
      - name: Run focused cache regression
        run: pnpm --filter @workspace/api-server exec node --import tsx --test src/lib/config/__tests__/providerConfigCache.test.ts
      - name: Typecheck
        run: pnpm run typecheck
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-server/src/lib/config/providerConfig.ts api-server/src/routes/settings.ts api-server/src/routes/providers.ts api-server/package.json
          git diff --cached --check
          git commit -m "Coalesce provider credential settings reads"
          git push origin HEAD:fix/provider-settings-query-storm
