name: Apply statewide 19-state recovery

on:
  push:
    branches:
      - agent/statewide-19-recovery
    paths:
      - .github/workflows/apply-statewide-19-recovery.yml

permissions:
  contents: write

jobs:
  apply-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: agent/statewide-19-recovery
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Apply recovery implementation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1))

          configs = "api-server/src/lib/providers/statewideProcurementConfigs.ts"
          replace_once(
              configs,
              '''  discoveryLinkPatterns?: readonly string[];
  interactiveAccessReason?: string;
}''',
              '''  discoveryLinkPatterns?: readonly string[];
  interactiveAccessReason?: string;
  requestTimeoutMs?: number;
  maxRetries?: number;
  maxPages?: number;
}''',
