import { describe, it } from "node:test";
import {
  CAL_EPROCURE_LISTING_URLS,
} from "../calEprocure";
import {
  STATEWIDE_PORTAL_CONFIGS,
  StatewideProcurementProvider,
} from "../statewideProcurementPortals";

const DEGRADED_SHARED_IDS = [
  "fl-vbs",
  "ga-gpr",
  "hi-hiepro",
  "il-bidbuy",
  "me-rfps",
  "nh-bids",
  "sd-solicitations",
  "va-eva",
  "wi-vendornet",
  "co-vss",
  "ks-esupplier",
  "ky-vss",
  "mi-sigma",
  "mn-swift",
  "or-oregonbuys",
  "tn-edison",
  "wa-webs",
  "wv-oasis",
] as const;

function config(portalId: string) {
  const found = STATEWIDE_PORTAL_CONFIGS.find((item) => item.portalId === portalId);
  assert.ok(found, `missing config ${portalId}`);
  return found;
}

describe("statewide 19-state recovery", () => {
  it("keeps all eighteen shared-family degraded states in one recovery manifest", () => {
    assert.equal(new Set(DEGRADED_SHARED_IDS).size, 18);
    for (const portalId of DEGRADED_SHARED_IDS) assert.ok(config(portalId));
  });

  it("uses corrected public listing routes for the known endpoint failures", () => {
    assert.match(config("hi-hiepro").listingUrl, /hands\.ehawaii\.gov\/hands\/opportunities/);
    assert.match(config("il-bidbuy").listingUrl, /openBids=true/);
    assert.match(config("ks-esupplier").listingUrl, /sokfsprdsup_1/);
    assert.match(config("mi-sigma").listingUrl, /AltSelfService/);
    assert.match(config("va-eva").listingUrl, /PublicSearch\.jsp/);
    assert.match(config("wv-oasis").listingUrl, /AltSelfService/);
  });

  it("applies bounded portal-specific recovery budgets", () => {
    for (const portalId of DEGRADED_SHARED_IDS) {
      const item = config(portalId);
      assert.ok((item.requestTimeoutMs ?? 0) >= 30_000, `${portalId} missing recovery timeout`);
      assert.ok((item.maxRetries ?? 0) >= 2, `${portalId} missing bounded retries`);
      assert.ok((item.maxPages ?? 0) >= 6, `${portalId} missing recovery page budget`);
    }
  });

  it("tries all three official Cal eProcure PeopleSoft nodes", () => {
    assert.equal(CAL_EPROCURE_LISTING_URLS.length, 3);
    assert.match(CAL_EPROCURE_LISTING_URLS[0], /psfpd1/);
    assert.match(CAL_EPROCURE_LISTING_URLS[1], /psfpd1_1/);
    assert.match(CAL_EPROCURE_LISTING_URLS[2], /psfpd1_2/);
  });

  it("submits CGI Advantage Public Access with the session cookie before parsing", async () => {
    const originalFetch = globalThis.fetch;
    const observed: Array<{ method: string; cookie: string | null; body: string }> = [];
    globalThis.fetch = async (_input, init) => {
      const headers = new Headers(init?.headers);
      observed.push({
        method: init?.method ?? "GET",
        cookie: headers.get("cookie"),
        body: init?.body instanceof URLSearchParams ? init.body.toString() : String(init?.body ?? ""),
      });
      if ((init?.method ?? "GET") === "GET") {
        return new Response(`
          <form method="post" action="/PRDVSS1X1/AltSelfService">
            <input type="hidden" name="csrf" value="abc123">
            <input type="submit" name="guest_login" value="Public Access">
          </form>
        `, { status: 200, headers: { "set-cookie": "session=public; Path=/; Secure" } });
      }
      return new Response(`
        <table>
          <tr><th>Solicitation Number</th><th>Title</th><th>Status</th><th>Due Date</th><th>Details</th></tr>
          <tr>
            <td>ME-2026-001</td>
            <td>Occupational health services</td>
            <td>Open</td>
            <td>12/31/2026</td>
            <td><a href="/PRDVSS1X1/AltSelfService?solicitation_number=ME-2026-001">Details</a></td>
          </tr>
        </table>
      `, { status: 200 });
    };
    try {
      const provider = new StatewideProcurementProvider(config("me-rfps"));
      const result = await provider.fetch({ limit: 1 });
      assert.equal(result.records.length, 1);
      assert.equal(result.records[0]?.solicitationNumber, "ME-2026-001");
      assert.equal(observed[0]?.method, "GET");
      assert.equal(observed[1]?.method, "POST");
      assert.equal(observed[1]?.cookie, "session=public");
      assert.match(observed[1]?.body ?? "", /guest_login=Public\+Access/);
      assert.match(observed[1]?.body ?? "", /csrf=abc123/);
    } finally {
      globalThis.fetch = originalFetch;
    }
  });
});
''')

