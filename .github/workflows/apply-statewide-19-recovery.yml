interface PublicFormSubmission {
  action: string;
  fields: Record<string, string>;
  label: string;
}

function decodeFormAttribute(value: string): string {
  return value
    .replace(/&amp;/gi, "&")
    .replace(/&quot;|&#34;/gi, '"')
    .replace(/&#39;|&apos;/gi, "'")
    .replace(/&lt;/gi, "<")
    .replace(/&gt;/gi, ">");
}

function formAttribute(tag: string, name: string): string | undefined {
  const quoted = tag.match(new RegExp(`\\\\b${name}\\\\s*=\\\\s*(["'])([\\\\s\\\\S]*?)\\\\1`, "i"))?.[2];
  if (quoted !== undefined) return decodeFormAttribute(quoted);
  const bare = tag.match(new RegExp(`\\\\b${name}\\\\s*=\\\\s*([^\\\\s>]+)`, "i"))?.[1];
  return bare === undefined ? undefined : decodeFormAttribute(bare);
}

function formFields(formHtml: string): Record<string, string> {
  const fields: Record<string, string> = {};
  for (const match of formHtml.matchAll(/<input\\b[^>]*>/gi)) {
    const tag = match[0];
    const name = formAttribute(tag, "name")?.trim();
    if (!name || /\\bdisabled\\b/i.test(tag)) continue;
    const type = formAttribute(tag, "type")?.toLowerCase();
    if ((type === "checkbox" || type === "radio") && !/\\bchecked\\b/i.test(tag)) continue;
    fields[name] = formAttribute(tag, "value") ?? "";
  }
  return fields;
}

export function extractPublicInteractiveForm(
  content: string,
  pageUrl: string,
  config: StatewidePortalConfig,
): PublicFormSubmission | undefined {
  for (const match of content.matchAll(/<form\\b[^>]*>[\\s\\S]*?<\\/form>/gi)) {
    const formHtml = match[0];
    const formTag = formHtml.match(/<form\\b[^>]*>/i)?.[0] ?? "";
    const rawAction = formAttribute(formTag, "action") || pageUrl;
    const action = allowedStatewideUrl(config, rawAction, pageUrl);
    if (!action) continue;
    const fields = formFields(formHtml);

    const publicAccess = /name=["']guest_login["']/i.test(formHtml)
      && /value=["']Public Access["']/i.test(formHtml);
    if (config.platformFamily === "cgi_advantage" && publicAccess) {
      fields.guest_login = "Public Access";
      return { action, fields, label: "Public Access guest transition" };
    }

    const telerikInitialLoad = config.portalId === "wi-vendornet"
      && /RadAjaxManager/i.test(content)
      && /ajaxRequest\\(["']InitialPageLoad["']\\)/i.test(content);
    if (telerikInitialLoad) {
      const clientId = content.match(/\\$find\\(["']([^"']*RadAjaxManager[^"']*)["']\\)\\.ajaxRequest\\(["']InitialPageLoad["']\\)/i)?.[1];
      if (clientId) {
        const uniqueId = clientId.replace(/_/g, "$");
        fields.__EVENTTARGET = uniqueId;
        fields.__EVENTARGUMENT = "InitialPageLoad";
        fields[uniqueId] = "InitialPageLoad";
        return { action, fields, label: "VendorNet InitialPageLoad postback" };
      }
    }
  }
  return undefined;
}
