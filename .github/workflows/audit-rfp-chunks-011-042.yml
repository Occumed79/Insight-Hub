name: Audit RFP chunks 011-042

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/audit-rfp-chunks-001-010
    paths:
      - scripts/audit-rfp-chunks-011-042.mjs
      - api-server/src/lib/providers/directRfpPortals.ts
      - api-server/src/lib/providers/directRfpPortals.generated.*.ts
      - .github/workflows/audit-rfp-chunks-011-042.yml

permissions:
  contents: read

jobs:
  live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit and generate strict-pruned chunks
        run: node scripts/audit-rfp-chunks-011-042.mjs

      - name: Publish audit summary
        if: always()
        run: |
          if [ -f audit-output/rfp-chunks-011-042/audit.md ]; then
            cat audit-output/rfp-chunks-011-042/audit.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload audit and pruned files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rfp-chunks-011-042-audit
          path: audit-output/rfp-chunks-011-042/
          if-no-files-found: error
          retention-days: 14
