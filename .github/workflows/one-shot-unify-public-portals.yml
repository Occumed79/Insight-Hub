name: Unify public portal discovery

on:
  push:
    branches:
      - agent/unify-public-portal-serper
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  unify-validate-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unify-public-portal-serper
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Fold Serper discovery into Public Portal Providers
        run: python scripts/one-shot-unify-public-portals.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Production build
        run: pnpm run build:prod

      - name: Verify unified public portal path
        run: |
          python <<'PY'
          from pathlib import Path
          public = Path("api-server/src/lib/providers/publicPortalProviders/index.ts").read_text()
          unified = Path("api-server/src/lib/search/unifiedSearch.ts").read_text()
          web = Path("api-server/src/lib/search/webIntelligence.ts").read_text()
          ui = Path("intel-suite/src/pages/portal/opportunities.tsx").read_text()
          scheduler = Path("api-server/src/lib/search/scheduler.ts").read_text()
          render = Path("render.yaml").read_text()
          routes = Path("api-server/src/routes/opportunities.ts").read_text()
          providers = Path("api-server/src/routes/providers.ts").read_text()

          assert 'statePortalsProvider.search' in public
          assert 'statePortalsProvider.toOpportunities' in public
          assert 'discoveryMethod: "serper_official_portal"' in public
          assert 'const PROVIDER_ALIASES = new Map([["statePortals", "publicPortalProviders"]])' in unified
          assert 'useStatePortals' not in unified
          assert 'statePortalsProvider' not in web
          assert 'statePortalResults' not in web
          assert 'key: "statePortals"' not in ui
          assert 'key: "publicPortalProviders"' in ui
          assert '"publicPortalProviders", "serper", "tavily"' in scheduler
          assert 'samGov,grantsGov,publicPortalProviders,serper,tavily' in render
          assert 'statePortals: "publicPortalProviders"' in routes
          assert '["texasEsbd", "nyScr", "statePortals"]' in providers
          PY

      - name: Commit changes and remove temporary files
        run: |
          rm .github/workflows/one-shot-unify-public-portals.yml
          rm scripts/one-shot-unify-public-portals.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: unify public portal parsing and Serper discovery"
          git push origin HEAD:agent/unify-public-portal-serper
