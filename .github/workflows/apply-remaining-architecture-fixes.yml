name: Apply remaining architecture fixes

on:
  push:
    branches:
      - agent/provider-boundary-cleanup

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/provider-boundary-cleanup
          fetch-depth: 0

      - name: Apply deterministic code edits
        run: python3 scripts/apply_remaining_architecture_fixes.py

      - name: Commit architecture fixes
        shell: bash
        run: |
          rm -f scripts/apply_remaining_architecture_fixes.py
          rm -f .github/workflows/apply-remaining-architecture-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete provider boundaries and portal architecture"
          git push origin HEAD:agent/provider-boundary-cleanup
