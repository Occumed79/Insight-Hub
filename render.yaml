services:
  - type: web
    name: insight-hub
    runtime: node
    region: oregon
    plan: starter
    buildCommand: pnpm install && pnpm run build:prod
    startCommand: pnpm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: BASE_PATH
        value: /
      - key: RFP_DATABASE_URL
        sync: false
      - key: INTEL_DATABASE_URL
        sync: false
      - key: PUBLIC_PORTAL_CONCURRENCY
        value: "4"
      - key: PUBLIC_PORTAL_SOURCE_TIMEOUT_MS
        value: "25000"
      - key: PUBLIC_PORTAL_RUN_TIMEOUT_MS
        value: "90000"
      - key: PUBLIC_PORTAL_MAX_PAGES
        value: "3"
      - key: SAM_GOV_API_KEY
        sync: false
      - key: USAJOBS_API_KEY
        sync: false
      - key: USAJOBS_USER_AGENT
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: BROWSE_AI_API_KEY
        sync: false
      - key: BROWSE_AI_ROBOT_ID
        sync: false
      - key: BROWSER_USE_API_KEY
        sync: false
      - key: OLOSTEP_API_KEY
        sync: false
      - key: CLOD_API_KEY
        sync: false
      - key: CLOD_MODEL
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: FAL_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_HOST
        sync: false
      - key: PINECONE_NAMESPACE
        sync: false
      - key: QDRANT_API_KEY
        sync: false
