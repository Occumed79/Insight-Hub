services:
  - type: web
    name: insight-hub
    env: node
    plan: free
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @workspace/db run db:generate && pnpm --filter insight-hub-api run build && pnpm --filter intel-suite run build
    startCommand: pnpm --filter insight-hub-api run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: PNPM_VERSION
        value: 9.15.9
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SAM_GOV_API_KEY
        sync: false
      - key: SAM_GOV_BASE_URL
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: MINIMAX_API_KEY
        sync: false
      - key: TANGO_API_KEY
        sync: false
      - key: BIDNET_API_KEY
        sync: false
      - key: BIDNET_BASE_URL
        sync: false
      - key: CLOD_API_KEY
        sync: false
      - key: CLOD_MODEL
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: FAL_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_HOST
        sync: false
      - key: PINECONE_NAMESPACE
        sync: false
      - key: QDRANT_API_KEY
        sync: false
